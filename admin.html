<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SJ Foods — ایڈمن پینل</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --dark:#153A20; --mid:#2E7D32; --leaf:#E8F5E9; --paper:#FFFDF8; --ink:#20241F; --muted:#8A8F86; --line:#E5E4DA; }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:"Segoe UI",sans-serif; direction:rtl; padding-bottom:40px;}
  header{background:linear-gradient(160deg,var(--dark),var(--mid)); color:#fff; padding:16px; border-radius:0 0 16px 16px;}
  header h1{margin:0; font-size:17px; font-family:"Noto Nastaliq Urdu",serif;}
  .wrap{padding:14px;}
  .card{background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px;}
  button{cursor:pointer; border:none; font-family:inherit;}
  .btn{background:var(--dark); color:#fff; border-radius:8px; padding:10px; font-size:13px; font-weight:700; width:100%;}
  .btn-success{background:#E8F5E9; color:#1B5E20; border:1px solid var(--mid); border-radius:8px; padding:8px; font-weight:700;}
  .btn-danger{background:#FFEBEE; color:#B71C1C; border-radius:8px; padding:6px 10px; font-size:11px;}
  
  .order-card{background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; position:relative;}
  .order-card.pending{animation: blink 1.8s infinite;}
  .order-card.completed{background:#F1F8E9; border-color:#81C784;}
  @keyframes blink{ 0%{border-color:#E53935;background:#FFEBEE;} 50%{border-color:#FFE082;background:#FFFDE7;} 100%{border-color:#E53935;background:#FFEBEE;} }
  
  .toast{position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--dark); color:#fff; padding:8px 16px; border-radius:20px; font-size:12px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:100;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <h1>⚙️ SJ Foods — لائیو آرڈرز پینل</h1>
</header>

<div class="wrap">
  <div class="card">
    <h3>🔔 کسٹمرز کے آرڈرز</h3>
    <div style="display:flex; gap:8px; margin-top:8px;">
      <button class="btn" style="background:var(--leaf); color:var(--dark);" onclick="testSound()">🔊 ٹیسٹ بیل</button>
      <button class="btn" style="background:#E8F5E9; color:#1B5E20;" onclick="fakeOrder()">🧪 فرضی آرڈر</button>
      <button class="btn" style="background:#FFEBEE; color:#B71C1C;" onclick="clearAll()">🗑️ صاف کریں</button>
    </div>
  </div>

  <div id="ordersArea"></div>
</div>

<div class="toast" id="toast"></div>

<script>
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=> t.classList.remove("show"), 2000);
}

function playSound(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.6);
  }catch(e){}
}

function testSound(){ playSound(); showToast("🔊 ساؤنڈ ٹھیک کام کر رہا ہے"); }

function fakeOrder(){
  const orders = JSON.parse(localStorage.getItem("sj_admin_orders") || "[]");
  orders.unshift({
    code: "SJ-" + Math.floor(1000 + Math.random() * 9000),
    name: "محمد خان (ٹیسٹ)", phone: "03155166034", address: "مینگورہ", area: "شہر کے اندر",
    payMethod: "کیش آن ڈیلیوری", itemsSummary: "ٹماٹر (1 کلو) — Rs. 150", total: 150,
    timestamp: Date.now(), date: new Date().toLocaleTimeString('ur-PK'), status: 'pending'
  });
  localStorage.setItem("sj_admin_orders", JSON.stringify(orders));
  playSound();
  renderOrders();
  showToast("✅ فرضی آرڈر آگیا!");
}

function renderOrders(){
  const area = document.getElementById("ordersArea");
  let orders = JSON.parse(localStorage.getItem("sj_admin_orders") || "[]");
  
  // 24 گھنٹے پرانے خود بخود ہٹانا
  const now = Date.now();
  orders = orders.filter(o => !o.timestamp || (now - o.timestamp < 24*60*60*1000));
  localStorage.setItem("sj_admin_orders", JSON.stringify(orders));

  if(orders.length === 0){
    area.innerHTML = `<div style="text-align:center; color:var(--muted); padding:30px;">کوئی آرڈر موجود نہیں</div>`;
    return;
  }

  area.innerHTML = orders.map((o, idx) => `
    <div class="order-card ${o.status==='completed'?'completed':'pending'}">
      <button class="btn-danger" style="position:absolute; top:10px; left:12px;" onclick="delOrder(${idx})">✕ حذف</button>
      <div style="font-weight:700; font-size:15px; margin-bottom:4px;">📌 ${o.code} — ${o.name}</div>
      <div style="font-size:12.5px; line-height:1.6;">
        📞 فون: ${o.phone}<br>
        📍 پتہ: ${o.address} (${o.area})<br>
        🛒 اشیاء: <div style="background:#fff; padding:6px; border-radius:6px; margin-top:2px;">${o.itemsSummary}</div>
        💰 کل رقم: <b>Rs. ${o.total}</b>
      </div>
      <div style="margin-top:10px; display:flex; gap:6px;">
        <button class="btn-success" style="flex:1;" onclick="markDelivered(${idx})">✅ ڈیلیورڈ (واٹس ایپ شکریہ)</button>
      </div>
    </div>
  `).join("");
}

function markDelivered(idx){
  let orders = JSON.parse(localStorage.getItem("sj_admin_orders") || "[]");
  orders[idx].status = 'completed';
  localStorage.setItem("sj_admin_orders", JSON.stringify(orders));
  renderOrders();
  
  const o = orders[idx];
  const msg = `السلام علیکم محترم ${o.name}! 🙏\nآپ کا آرڈر [${o.code}] پہنچا دیا گیا ہے۔ SJ Foods کو منتخب کرنے کا شکریہ! 🌿`;
  let phone = o.phone.replace(/[^0-9]/g, "");
  if(phone.startsWith("0")) phone = "92" + phone.slice(1);
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, "_blank");
}

function delOrder(idx){
  if(!confirm("حذف کریں؟")) return;
  let orders = JSON.parse(localStorage.getItem("sj_admin_orders") || "[]");
  orders.splice(idx, 1);
  localStorage.setItem("sj_admin_orders", JSON.stringify(orders));
  renderOrders();
}

function clearAll(){
  if(!confirm("تمام ہسٹری صاف کریں؟")) return;
  localStorage.removeItem("sj_admin_orders");
  renderOrders();
}

renderOrders();
</script>
</body>
</html>
