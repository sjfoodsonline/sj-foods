<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SJ Foods — محفوظ لائیو آرڈرز پینل</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Jameel+Noori+Nastaleeq&display=swap" rel="stylesheet">
<style>
  :root{
    --dark:#153A20; --mid:#2E7D32; --leaf:#E8F5E9; --accent:#FF6F00;
    --paper:#FFFDF8; --ink:#20241F; --muted:#8A8F86; --price:#B71C1C; --line:#E5E4DA;
  }
  *{box-sizing:border-box;}
  html{ background:#EDEAE0; height:100%; overflow-x:hidden; }
  body{
    margin:0 auto; padding:0 0 90px 0; background:var(--paper); color:var(--ink);
    font-family:"Segoe UI",system-ui,sans-serif; direction:rtl; text-align:right;
    width:100%; max-width:480px; min-height:100vh; position:relative;
    box-shadow:0 0 40px rgba(0,0,0,0.12); overflow-x:hidden;
  }
  header{background:linear-gradient(160deg,var(--dark),var(--mid)); color:#fff; padding:16px; border-radius:0 0 18px 18px;}
  header h1{margin:0; font-size:18px; font-family:"Jameel Noori Nastaleeq",serif;}
  header p{margin:4px 0 0; font-size:11.5px; opacity:.9;}

  .wrap{padding:14px;}
  .card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px;}
  .card h3{margin:0 0 10px; font-size:14px; color:var(--dark); font-family:"Jameel Noori Nastaleeq",serif;}
  .card p{font-size:12px; color:var(--muted); line-height:1.7; margin:0 0 10px;}
  button{font-family:inherit; cursor:pointer; border:none;}
  .btn-primary{background:var(--dark); color:#fff; border-radius:10px; padding:11px 16px; font-size:13.5px; font-weight:700; width:100%;}
  .btn-secondary{background:var(--leaf); color:var(--dark); border-radius:9px; padding:8px 12px; font-size:12.5px; font-weight:700;}
  .btn-danger{background:#FDECEA; color:#B71C1C; border-radius:9px; padding:8px 10px; font-size:12px; font-weight:700;}
  
  .tabs{display:flex; gap:8px; margin-bottom:14px;}
  .tab{flex:1; padding:11px; text-align:center; background:#fff; border:1px solid var(--line); border-radius:10px; font-weight:700; font-size:13px; color:#fff; background:var(--dark); cursor:pointer;}

  .order-card{background:#fff; border:2px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; position:relative;}
  .order-card.pending{animation: superBlinking 0.8s infinite ease-in-out;}
  .order-card.completed{background:#F1F8E9; border-color:#81C784;}
  @keyframes superBlinking{ 
    0%{border-color:#D32F2F; background:#FFCDD2; box-shadow:0 0 15px rgba(211,47,47,0.7);} 
    50%{border-color:#FFA000; background:#FFFDE7; box-shadow:0 0 0px transparent;} 
    100%{border-color:#D32F2F; background:#FFCDD2; box-shadow:0 0 15px rgba(211,47,47,0.7);} 
  }

  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--dark); color:#fff;
    padding:10px 18px; border-radius:30px; font-size:12.5px; opacity:0; pointer-events:none; transition:opacity .25s, top .25s; z-index:100;
  }
  .toast.show{opacity:1; top:26px;}
  .toast.err{background:#B71C1C;}
  .loading{text-align:center; color:var(--muted); font-size:12.5px; padding:20px;}
</style>
</head>
<body>

<header>
  <h1>⚙️ SJ Foods — ایڈمن لائیو پینل</h1>
  <p>گوگل شیٹ سے جڑا ہوا خودکار نظام</p>
</header>

<div class="wrap">

  <div class="tabs">
    <div class="tab">🔔 لائیو آرڈرز (گوگل شیٹ سے منسلک)</div>
  </div>

  <div id="secOrders">
    <div class="card">
      <h3>🔔 کسٹمرز کے لائیو آرڈرز</h3>
      <p>صرف "SJ-" کوڈ والے آرڈرز یہاں شو ہوں گے۔ نیا آرڈر آنے پر گھنٹی بجے گی۔</p>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button class="btn-secondary" style="flex:1; background:#D32F2F; color:#fff;" onclick="playBeepTech(); showToast('✅ گھنٹی ایکٹیو ہے');">🔊 گھنٹی ٹیسٹ کریں</button>
      </div>
    </div>
    <div id="ordersArea"><div class="loading">⏳ گوگل شیٹ سے آرڈرز لوڈ ہو رہے ہیں...</div></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbzKSCq_94xthvKY6isryQpgwsq_BGPRQ2InQ8is2Ge3kxP02ocK0Go7jboBicShuM2M/exec";

function showToast(msg, isErr){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (isErr ? " err" : "");
  setTimeout(()=> t.className = "toast", 2600);
}

function playBeepTech(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    let time = ctx.currentTime;
    for(let i = 0; i < 4; i++){
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "square";
      osc.frequency.setValueAtTime(1200, time);
      gain.gain.setValueAtTime(0.8, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.15);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(time);
      osc.stop(time + 0.15);
      time += 0.2;
    }
  }catch(e){}
}

async function fetchOrdersFromSheet(){
  if(!SHEET_URL) return [];
  try{
    const res = await fetch(SHEET_URL);
    const data = await res.json();
    // صرف وہ ریکارڈز فلٹر کریں جن میں کوڈ 'SJ-' موجود ہو تاکہ ذاتی میسجز نہ آئیں
    return data.filter(row => row.code && row.code.includes("SJ-")).map((row, index) => ({
      id: index,
      code: row.code,
      name: row.name,
      phone: row.phone,
      address: row.address,
      itemsSummary: row.items,
      total: row.total,
      otpCode: row.otp || Math.floor(1000 + Math.random() * 9000),
      date: new Date(row.timestamp).toLocaleTimeString(),
      status: row.status || 'pending'
    }));
  }catch(e){
    console.error(e);
    return [];
  }
}

let cachedOrders = [];
async function renderOrders(){
  const area = document.getElementById("ordersArea");
  const orders = await fetchOrdersFromSheet();
  
  if(orders.length === 0){
    area.innerHTML = `<div style="text-align:center; color:var(--muted); padding:30px;">کوئی نیا آرڈر موجود نہیں</div>`;
    return;
  }

  if(orders.length > cachedOrders.length && cachedOrders.length !== 0){
    playBeepTech();
  }
  cachedOrders = orders;

  area.innerHTML = orders.map((o, idx) => `
    <div class="order-card ${o.status==='completed'?'completed':'pending'}">
      <div style="font-weight:800; font-size:16px; margin-bottom:6px;">📌 ${o.code} — ${o.name} <span style="font-size:11px; color:var(--muted); float:left;">${o.date || ''}</span></div>
      <div style="font-size:13.5px; line-height:1.7;">
        📞 فون: ${o.phone}<br>
        📍 پتہ: ${o.address}<br>
        🔐 ڈلیوری کوڈ (OTP): <b style="color:var(--price); font-size:15px;">${o.otpCode}</b><br>
        🛒 اشیاء: <div style="background:#fff; padding:8px; border-radius:8px; margin-top:4px;">${o.itemsSummary}</div>
        💰 کل رقم: <b>Rs. ${o.total}</b><br>
        وضعیت: <b>${o.status === 'completed' ? '✅ مکمل / کلوزڈ' : '⏳ نیا آرڈر (پینڈنگ)'}</b>
      </div>
      
      <div style="margin-top:12px; display:flex; gap:6px; flex-wrap:wrap;">
        <button class="btn-secondary" style="flex:1; background:#FFF3CD; color:#856404;" onclick="printReceipt('${o.code}', '${o.name}', '${o.phone}', '${o.address}', \`${o.itemsSummary}\`, ${o.total}, ${o.otpCode})">🖨️ پرنٹ (تھرمل/A4)</button>
        ${o.status !== 'completed' ? `
          <button class="btn-secondary" style="flex:1; background:#25D366; color:#fff;" onclick="sendFirstWhatsAppMessage('${o.phone}', '${o.name}', '${o.code}', ${o.otpCode})">📲 پہلا آٹو میسج (کوڈ)</button>
          <button class="btn-secondary" style="flex:1; background:#C8E6C9; color:#1B5E20; font-weight:700;" onclick="completeAndThankYou('${o.phone}', '${o.name}')">✅ آرڈر کلوز کریں</button>
        ` : `<div style="width:100%; text-align:center; font-size:12px; color:var(--mid); font-weight:700; margin-top:4px;">🔒 یہ آرڈر مکمل ہو چکا ہے</div>`}
        <button class="btn-danger" style="flex:0 0 auto;" onclick="deleteOrderRow(${idx})">🗑️ حذف</button>
      </div>
    </div>
  `).join("");
}

function sendFirstWhatsAppMessage(phone, name, code, otp){
  const msg = `السلام علیکم محترم *${name}* صاحب! 🙏\n\nSJ Foods Mingora پر آپ کا آرڈر *[${code}]* موصول ہو گیا ہے۔\n\n🔐 آپ کا ڈیلیوری تصدیقی کوڈ: *${otp}* ہے۔\n\nجب ہمارا ڈیلیوری مین آپ کے پاس سامان لے کر پہنچے گا، تو براہ کرم یہ کوڈ اسے بتائیں تاکہ آپ کا آرڈر کنفرم ہو سکے۔ شکریہ! 🌿`;
  
  let cleanPhone = phone.replace(/[^0-9]/g, "");
  if(cleanPhone.startsWith("0")) cleanPhone = "92" + cleanPhone.slice(1);
  
  window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`, "_blank");
  showToast("✅ پہلا تصدیقی میسج واٹس ایپ پر بھیج دیا گیا!");
}

function completeAndThankYou(phone, name){
  if(!confirm("کیا آپ اس آرڈر کو کنفرم کر کے کلوز کرنا چاہتے ہیں؟")) return;
  
  const msg = `السلام علیکم محترم *${name}* صاحب! 🙏\n\nآپ کا آرڈر کامیابی کے ساتھ آپ تک پہنچا دیا گیا ہے۔ SJ Foods Mingora کو منتخب کرنے اور ہمارے ساتھ تعاون کرنے کا تہہ دل سے شکریہ! ⭐\n\nہم آئندہ بھی آپ کو بہترین اور تازہ اشیاء فراہم کرنے کے لیے پرعزم ہیں۔`;
  
  let cleanPhone = phone.replace(/[^0-9]/g, "");
  if(cleanPhone.startsWith("0")) cleanPhone = "92" + cleanPhone.slice(1);
  
  window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`, "_blank");
  showToast("✅ آرڈر کلوز کر دیا گیا اور شکریہ کا میسج کھل گیا!");
}

function deleteOrderRow(idx){
  if(!confirm("کیا آپ اس ریکارڈ کو پینل سے ہٹانا چاہتے ہیں؟")) return;
  showToast("✅ آرڈر پینل سے ہٹا دیا گیا");
  cachedOrders.splice(idx, 1);
  renderOrders();
}

function printReceipt(code, name, phone, address, items, total, otp){
  const w = window.open('', '_blank');
  w.document.write(`
    <html dir="rtl">
    <head><title>Receipt ${code}</title></head>
    <body style="font-family:monospace; padding:15px; width:300px; margin:0 auto;">
      <h2 style="text-align:center; margin:0;">SJ Foods Mingora</h2>
      <p style="text-align:center; font-size:12px; margin:2px 0;">تازہ سبزیاں و کریانہ ہوم ڈلیوری</p>
      <hr style="border:dashed 1px #000;">
      <p><b>آرڈر کوڈ:</b> ${code}</p>
      <p><b>نام:</b> ${name}</p>
      <p><b>فون:</b> ${phone}</p>
      <p><b>پتہ:</b> ${address}</p>
      <p><b>ڈیلیوری کوڈ (OTP):</b> <span style="font-size:18px;"><b>${otp}</b></span></p>
      <hr style="border:dashed 1px #000;">
      <p><b>آرڈر کی تفصیل:</b></p>
      <div>${items}</div>
      <hr style="border:dashed 1px #000;">
      <h3 style="text-align:center;">کل رقم: Rs. ${total}</h3>
      <br>
      <div style="text-align:center; font-size:11px;">ڈلیوری کے وقت OTP کوڈ لازمی بتائیں۔</div>
    </body>
    </html>
  `);
  w.document.close();
  w.focus();
  setTimeout(()=> { w.print(); w.close(); }, 500);
}

// پینل شروع کریں اور ہر 10 سیکنڈ بعد شیٹ چیک کریں
renderOrders();
setInterval(renderOrders, 10000);
</script>
</body>
</html>
