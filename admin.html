<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SJ Foods Admin Panel — مینجمنٹ پینل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --dark: #153A20;
    --mid: #2E7D32;
    --leaf: #E8F5E9;
    --accent: #FF6F00;
    --paper: #FFFDF8;
    --ink: #20241F;
    --muted: #8A8F86;
    --line: #E5E4DA;
    --card: #FFFFFF;
    --danger: #B71C1C;
    --app-w: 480px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    direction: rtl;
    padding-bottom: 40px;
  }

  /* Laptop/PC Screen Constraint (Mobile View Centered) */
  @media (min-width: 640px) {
    html { background: #EDEAE0; }
    body {
      max-width: var(--app-w);
      margin: 20px auto;
      min-height: 95vh;
      box-shadow: 0 0 50px rgba(0,0,0,0.18);
      border-radius: 20px;
      overflow: hidden;
    }
  }

  header {
    background: linear-gradient(160deg, var(--dark), var(--mid));
    color: #fff;
    padding: 18px 16px;
    text-align: center;
    box-shadow: 0 4px 12px rgba(21,58,32,0.2);
  }
  header h1 {
    margin: 0;
    font-size: 20px;
    font-family: "Noto Nastaliq Urdu", serif;
  }
  header p { margin: 4px 0 0; font-size: 12px; opacity: 0.85; }

  .container { padding: 16px; }

  .tab-buttons {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    border-bottom: 2px solid var(--line);
    padding-bottom: 8px;
  }
  .tab-btn {
    flex: 1;
    padding: 10px;
    border: none;
    background: var(--leaf);
    color: var(--dark);
    font-weight: 700;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
  }
  .tab-btn.active {
    background: var(--dark);
    color: #fff;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .card h3 { margin-top: 0; font-size: 15px; color: var(--dark); }

  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 4px; color: var(--ink); }
  .form-group input, .form-group select {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    font-family: inherit;
    direction: rtl;
    font-size: 13.5px;
  }

  /* File Input & Multiple Images Preview */
  .file-input-wrapper {
    position: relative;
    border: 1.5px dashed var(--mid);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
    background: var(--leaf);
    cursor: pointer;
  }
  .file-input-wrapper input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }
  .file-input-label {
    font-size: 12.5px;
    color: var(--dark);
    font-weight: 700;
  }

  .image-preview-container {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .preview-thumb {
    position: relative;
    width: 60px;
    height: 60px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .preview-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .preview-thumb .remove-btn {
    position: absolute;
    top: 2px;
    left: 2px;
    background: var(--danger);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 18px;
    height: 18px;
    font-size: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--mid);
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-danger { background: var(--danger); }
  .btn-accent { background: var(--accent); }

  .item-list-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px;
    border-bottom: 1px solid var(--line);
  }
  .item-list-row:last-child { border-bottom: none; }
  .item-info { display: flex; align-items: center; gap: 10px; }
  .item-imgs { display: flex; gap: 4px; }
  .item-imgs img { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; }

  .actions-flex { display: flex; gap: 6px; }
  .actions-flex button {
    padding: 6px 10px;
    border: none;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--dark);
    color: #fff;
    padding: 10px 18px;
    border-radius: 30px;
    font-size: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    z-index: 100;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>⚙️ ایڈمن پینل — SJ Foods</h1>
  <p>آئٹمز، کیٹیگریز اور تصاویر ہینڈل کریں</p>
</header>

<div class="container">
  <!-- Tabs Navigation -->
  <div class="tab-buttons">
    <button class="tab-btn active" id="tabItemsBtn" onclick="switchTab('items')">🛒 پروڈکٹس</button>
    <button class="tab-btn" id="tabCatsBtn" onclick="switchTab('cats')">📁 کیٹیگریز</button>
  </div>

  <!-- ITEMS TAB -->
  <div id="tabItems">
    <div class="card">
      <h3 id="itemFormTitle">➕ نیا پروڈکٹ شامل کریں</h3>
      <input type="hidden" id="itemId">
      
      <div class="form-group">
        <label>کیٹیگری منتخب کریں</label>
        <select id="itemCatSelect"></select>
      </div>

      <div class="form-group">
        <label>پروڈکٹ کا نام (اردو)</label>
        <input type="text" id="itemNameUrdu" placeholder="مثلاً: ٹماٹر">
      </div>

      <div class="form-group">
        <label>پروڈکٹ کا نام (رومن)</label>
        <input type="text" id="itemNameRoman" placeholder="مثلاً: Tomato">
      </div>

      <div class="form-group">
        <label>قیمت (Rs.)</label>
        <input type="number" id="itemRate" placeholder="120">
      </div>

      <div class="form-group">
        <label>یونٹ (Unit)</label>
        <input type="text" id="itemUnit" placeholder="مثلاً: کلوگرام / 1 کلو">
      </div>

      <!-- Multiple Image Upload with Camera Support -->
      <div class="form-group">
        <label>پروڈکٹ کی تصاویر (ایک یا ایک سے زیادہ)</label>
        <div class="file-input-wrapper">
          <div class="file-input-label">📸 کیمرے سے تصویر لیں یا گیلری سے منتخب کریں</div>
          <input type="file" id="itemImagesInput" accept="image/*" capture="environment" multiple onchange="handleImageUpload(event, 'item')">
        </div>
        <div class="image-preview-container" id="itemImagePreviews"></div>
      </div>

      <button class="btn" id="saveItemBtn" onclick="saveItem()">💾 پروڈکٹ محفوظ کریں</button>
    </div>

    <!-- Items List -->
    <div class="card">
      <h3>📋 تمام پروڈکٹس کی فہرست</h3>
      <div id="itemsContainer"></div>
    </div>
  </div>

  <!-- CATEGORIES TAB -->
  <div id="tabCats" style="display: none;">
    <div class="card">
      <h3>📁 نئی کیٹیگری شامل کریں</h3>
      <div class="form-group">
        <label>کیٹیگری نام (اردو)</label>
        <input type="text" id="catName" placeholder="مثلاً: تازہ سبزیاں">
      </div>
      <div class="form-group">
        <label>کیٹیگری آئیکن (Emoji)</label>
        <input type="text" id="catIcon" placeholder="🥦">
      </div>

      <!-- Multiple Category Banner/Images -->
      <div class="form-group">
        <label>کیٹیگری کی تصویر / بینر</label>
        <div class="file-input-wrapper">
          <div class="file-input-label">📸 کیمرے سے تصویر لیں یا گیلری منتخب کریں</div>
          <input type="file" id="catImagesInput" accept="image/*" capture="environment" multiple onchange="handleImageUpload(event, 'cat')">
        </div>
        <div class="image-preview-container" id="catImagePreviews"></div>
      </div>

      <button class="btn btn-accent" onclick="saveCategory()">💾 کیٹیگری محفوظ کریں</button>
    </div>

    <div class="card">
      <h3>📁 موجودہ کیٹیگریز</h3>
      <div id="categoriesContainer"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let tempItemImages = [];
  let tempCatImages = [];

  let categories = [
    { id: "veg", name: "تازہ سبزیاں", icon: "🥦", images: [] },
    { id: "fruit", name: "تازہ پھل", icon: "🍎", images: [] }
  ];

  let items = [
    { id: "1", cat: "veg", name: "ٹماٹر", name_roman: "Tomato", rate: 120, unit: "کلو", images: ["potato.jpg"], available: true }
  ];

  function switchTab(tab) {
    document.getElementById("tabItems").style.display = tab === 'items' ? 'block' : 'none';
    document.getElementById("tabCats").style.display = tab === 'cats' ? 'block' : 'none';
    document.getElementById("tabItemsBtn").classList.toggle("active", tab === 'items');
    document.getElementById("tabCatsBtn").classList.toggle("active", tab === 'cats');
  }

  // Handle Image Upload & Conversion (Supports Camera & Multiple Selection)
  function handleImageUpload(event, type) {
    const files = event.target.files;
    if (!files || files.length === 0) return;

    Array.from(files).forEach(file => {
      const reader = new FileReader();
      reader.onload = function(e) {
        if (type === 'item') {
          tempItemImages.push(e.target.result);
          renderPreviews('item');
        } else {
          tempCatImages.push(e.target.result);
          renderPreviews('cat');
        }
      };
      reader.readAsDataURL(file);
    });
  }

  // Render Image Thumbnails with Delete Option
  function renderPreviews(type) {
    const container = document.getElementById(type === 'item' ? 'itemImagePreviews' : 'catImagePreviews');
    const list = type === 'item' ? tempItemImages : tempCatImages;
    container.innerHTML = "";

    list.forEach((imgSrc, index) => {
      const thumb = document.createElement("div");
      thumb.className = "preview-thumb";
      thumb.innerHTML = `
        <img src="${imgSrc}" alt="Preview">
        <button class="remove-btn" onclick="removeImage(${index}, '${type}')">✕</button>
      `;
      container.appendChild(thumb);
    });
  }

  function removeImage(index, type) {
    if (type === 'item') {
      tempItemImages.splice(index, 1);
      renderPreviews('item');
    } else {
      tempCatImages.splice(index, 1);
      renderPreviews('cat');
    }
  }

  function renderCategoryOptions() {
    const select = document.getElementById("itemCatSelect");
    select.innerHTML = "";
    categories.forEach(c => {
      select.innerHTML += `<option value="${c.id}">${c.icon} ${c.name}</option>`;
    });
  }

  function saveItem() {
    const id = document.getElementById("itemId").value;
    const cat = document.getElementById("itemCatSelect").value;
    const name = document.getElementById("itemNameUrdu").value.trim();
    const name_roman = document.getElementById("itemNameRoman").value.trim();
    const rate = parseFloat(document.getElementById("itemRate").value) || 0;
    const unit = document.getElementById("itemUnit").value.trim();

    if (!name || !rate) {
      showToast("براہ کرم تمام لازمی معلومات درج کریں");
      return;
    }

    if (id) {
      // Edit
      const idx = items.findIndex(i => i.id === id);
      if (idx !== -1) {
        items[idx] = { ...items[idx], cat, name, name_roman, rate, unit, images: [...tempItemImages] };
      }
    } else {
      // Create
      const newItem = {
        id: Date.now().toString(),
        cat, name, name_roman, rate, unit,
        images: [...tempItemImages],
        available: true
      };
      items.push(newItem);
    }

    resetItemForm();
    renderItemsList();
    showToast("✅ پروڈکٹ محفوظ ہو گیا ہے");
  }

  function resetItemForm() {
    document.getElementById("itemId").value = "";
    document.getElementById("itemNameUrdu").value = "";
    document.getElementById("itemNameRoman").value = "";
    document.getElementById("itemRate").value = "";
    document.getElementById("itemUnit").value = "";
    tempItemImages = [];
    renderPreviews('item');
    document.getElementById("itemFormTitle").textContent = "➕ نیا پروڈکٹ شامل کریں";
  }

  function renderItemsList() {
    const container = document.getElementById("itemsContainer");
    container.innerHTML = "";

    items.forEach(it => {
      const row = document.createElement("div");
      row.className = "item-list-row";
      
      const imgHtml = (it.images && it.images.length) 
        ? it.images.map(src => `<img src="${src}">`).join("")
        : `<span style="font-size:24px;">🛒</span>`;

      row.innerHTML = `
        <div class="item-info">
          <div class="item-imgs">${imgHtml}</div>
          <div>
            <strong>${it.name}</strong> (${it.unit})<br>
            <small style="color:var(--muted);">Rs. ${it.rate}</small>
          </div>
        </div>
        <div class="actions-flex">
          <button style="background:var(--leaf); color:var(--dark);" onclick="editItem('${it.id}')">✏️ ایڈٹ</button>
          <button style="background:#FFEBEE; color:var(--danger);" onclick="deleteItem('${it.id}')">🗑️</button>
        </div>
      `;
      container.appendChild(row);
    });
  }

  function editItem(id) {
    const it = items.find(i => i.id === id);
    if (!it) return;

    document.getElementById("itemId").value = it.id;
    document.getElementById("itemCatSelect").value = it.cat;
    document.getElementById("itemNameUrdu").value = it.name;
    document.getElementById("itemNameRoman").value = it.name_roman || "";
    document.getElementById("itemRate").value = it.rate;
    document.getElementById("itemUnit").value = it.unit;
    tempItemImages = it.images ? [...it.images] : [];
    renderPreviews('item');
    document.getElementById("itemFormTitle").textContent = "✏️ پروڈکٹ ایڈٹ کریں";
  }

  function deleteItem(id) {
    if (confirm("کیا آپ واقعی اس پروڈکٹ کو ختم کرنا چاہتے ہیں؟")) {
      items = items.filter(i => i.id !== id);
      renderItemsList();
      showToast("پروڈکٹ ختم کر دیا گیا");
    }
  }

  function saveCategory() {
    const name = document.getElementById("catName").value.trim();
    const icon = document.getElementById("catIcon").value.trim() || "📁";

    if (!name) {
      showToast("کیٹیگری کا نام درج کریں");
      return;
    }

    const newCat = { id: "cat_" + Date.now(), name, icon, images: [...tempCatImages] };
    categories.push(newCat);
    document.getElementById("catName").value = "";
    document.getElementById("catIcon").value = "";
    tempCatImages = [];
    renderPreviews('cat');
    renderCategoryOptions();
    renderCategoriesList();
    showToast("✅ کیٹیگری شامل ہو گئی");
  }

  function renderCategoriesList() {
    const container = document.getElementById("categoriesContainer");
    container.innerHTML = "";
    categories.forEach(c => {
      container.innerHTML += `
        <div class="item-list-row">
          <div>${c.icon} <strong>${c.name}</strong></div>
          <small>${c.images ? c.images.length : 0} تصاویر</small>
        </div>
      `;
    });
  }

  function showToast(msg) {
    const toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2000);
  }

  // Init
  renderCategoryOptions();
  renderItemsList();
  renderCategoriesList();
</script>
</body>
</html>
