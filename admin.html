<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = { databaseURL: "https://sj-foods-default-rtdb.firebaseio.com" };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  window.dbRef = { ref, update, db };

  // پرانے آرڈرز لوڈ کرنے کے لیے درست کنکشن
  const ordersRef = ref(db, 'orders');
  onValue(ordersRef, (snapshot) => {
    const data = snapshot.val();
    if (!data) {
      document.getElementById("ordersArea").innerHTML = "کوئی آرڈر موجود نہیں";
      return;
    }
    
    // ڈیٹا کو لسٹ میں تبدیل کریں
    let dataList = Object.keys(data).map(key => ({ ...data[key], code: key }));
    latestOrdersCache = dataList.reverse(); // نئے آرڈرز اوپر آئیں گے
    renderOrdersDOM();
  });
</script>
