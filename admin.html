<!DOCTYPE html>
<html lang="ur" dir="rtl" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SJ Foods — ایڈمن کنٹرول سینٹر</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Jameel+Noori+Nastaleeq&display=swap" rel="stylesheet">
<style>
  :root{
    --dark:#153A20; --mid:#2E7D32; --leaf:#E8F5E9; --accent:#FF6F00;
    --paper:#FFFDF8; --ink:#20241F; --muted:#8A8F86; --price:#B71C1C; --line:#E5E4DA;
  }
  *{box-sizing:border-box;}
  html{ background:#EDEAE0; height:100%; overflow-x:hidden; }
  body{
    margin:0 auto; padding:0 0 110px 0; background:var(--paper); color:var(--ink);
    font-family:"Segoe UI",system-ui,sans-serif; direction:rtl; text-align:right;
    width:100%; max-width:480px; min-height:100vh; position:relative;
    box-shadow:0 0 40px rgba(0,0,0,0.12); overflow-x:hidden;
  }
  header{background:linear-gradient(160deg,var(--dark),var(--mid)); color:#fff; padding:16px; border-radius:0 0 18px 18px;}
  header h1{margin:0; font-size:18px; font-family:"Jameel Noori Nastaleeq",serif;}
  header p{margin:4px 0 0; font-size:11.5px; opacity:.9;}

  .wrap{padding:14px;}
  
  .dash-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:12px;}
  .dash-card{background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 6px; text-align:center;}
  .dash-num{font-size:16px; font-weight:800; color:var(--dark); margin-top:2px;}
  .dash-lbl{font-size:10.5px; color:var(--muted); font-weight:700;}

  .card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px;}
  .card h3{margin:0 0 10px; font-size:14px; color:var(--dark); font-family:"Jameel Noori Nastaleeq",serif;}
  
  .chat-item{background:#fff; border:2px solid var(--line); border-radius:14px; margin-bottom:10px; overflow:hidden; transition: all 0.3s;}
  
  /* Blinking Red Border جب تک سامان ڈلیور نہ ہو */
  @keyframes blinkRedBorder {
    0% { border-color: #D32F2F; box-shadow: 0 0 8px rgba(211, 47, 47, 0.4); }
    50% { border-color: #FF8A80; box-shadow: 0 0 18px rgba(255, 23, 68, 0.8); }
    100% { border-color: #D32F2F; box-shadow: 0 0 8px rgba(211, 47, 47, 0.4); }
  }
  .chat-item.pending {
    animation: blinkRedBorder 1.2s infinite;
    background: #FFFDE7;
  }
  
  /* Calm Green جب ڈلیوری مکمل ہو جائے */
  .chat-item.completed {
    background: #F1F8E9 !important;
    border-color: #81C784 !important;
    animation: none !important;
    opacity: 0.9;
  }

  .chat-header{padding:12px 14px; font-weight:800; font-size:14.5px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; background:rgba(0,0,0,0.02);}
  .chat-body{padding:0 14px 14px; display:none; border-top:1px dashed var(--line); margin-top:8px; direction:rtl; text-align:right;}
  .chat-item.open .chat-body{display:block;}

  .time-badge{
    font-family: monospace, sans-serif; font-size: 11px; font-weight: 800;
    padding: 3px 6px; border-radius: 6px; direction: ltr; display: flex; align-items: center; gap: 4px;
    background: #E8F5E9; color: #2E7D32; border: 1px solid #A5D6A7;
  }
  .time-badge.done { background: #E8F5E9; color: #1B5E20; }

  .challenge-tag {
    color: #FFF; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px; margin-left: 4px; background: #D32F2F;
  }

  .btn-secondary{background:var(--leaf); color:var(--dark); border-radius:9px; padding:8px 10px; font-size:12px; font-weight:700; border:none; cursor:pointer;}
  
  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--dark); color:#fff;
    padding:10px 18px; border-radius:30px; font-size:12.5px; opacity:0; pointer-events:none; transition:opacity .25s, top .25s; z-index:200;
  }
  .toast.show{opacity:1; top:26px;}
  .loading{text-align:center; color:var(--muted); font-size:12.5px; padding:20px;}

  /* Thermal Print Specific Style */
  @media print {
    body * { visibility: hidden; }
    #printableReceipt, #printableReceipt * { visibility: visible; }
    #printableReceipt { position: absolute; left: 0; top: 0; width: 100%; direction: rtl; font-family: Arial, sans-serif; padding: 10px; color: #000; }
  }
</style>
</head>
<body>

<header>
  <h1>⚙️ SJ Foods — ایڈمن پینل</h1>
  <p>لائیو آرڈرز کنٹرول سینٹر (Firebase Connected)</p>
</header>

<div class="wrap">
  <div class="dash-grid">
    <div class="dash-card">
      <div class="dash-lbl">📦 کل آرڈرز</div>
      <div class="dash-num" id="statTotalOrders">0</div>
    </div>
    <div class="dash-card">
      <div class="dash-lbl">⏳ پینڈنگ</div>
      <div class="dash-num" style="color:var(--price);" id="statPendingOrders">0</div>
    </div>
    <div class="dash-card">
      <div class="dash-lbl">💵 کل سیلز</div>
      <div class="dash-num" style="color:var(--mid);" id="statTotalSales">Rs. 0</div>
    </div>
  </div>

  <div class="card">
    <h3>🔔 کسٹمرز کے لائیو آرڈرز</h3>
    <div style="display:flex; gap:6px; margin-top:8px;">
      <button class="btn-secondary" style="flex:1; background:#1877F2; color:#fff;" onclick="requestNotificationPermission()">🔔 نوٹیفکیشن آن کریں</button>
      <button class="btn-secondary" style="flex:1; background:#5D4037; color:#fff;" onclick="playTestSound()">🔊 ٹیسٹ بیل</button>
    </div>
  </div>
  
  <div id="ordersArea"><div class="loading">⏳ فائر بیس سے آرڈرز لوڈ ہو رہے ہیں...</div></div>
</div>

<!-- Hidden container for thermal printing -->
<div id="printableReceipt" style="display:none;"></div>

<div class="toast" id="toast"></div>

<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    databaseURL: "https://sj-foods-default-rtdb.firebaseio.com"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  function showToast(msg, isErr){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "toast show" + (isErr ? " err" : "");
    setTimeout(()=> t.className = "toast", 2600);
  }

  function playLoudBeep(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      let time = ctx.currentTime;
      for(let loop = 0; loop < 2; loop++){
        for(let i = 0; i < 4; i++){
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(1000 + (i * 200), time);
          gain.gain.setValueAtTime(3.0, time);
          gain.gain.exponentialRampToValueAtTime(0.01, time + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(time);
          osc.stop(time + 0.25);
          time += 0.28;
        }
        time += 0.2;
      }
    }catch(e){}
  }
  window.playTestSound = playLoudBeep;

  window.requestNotificationPermission = function() {
    if ('Notification' in window) {
      Notification.requestPermission().then(permission => {
        if (permission === 'granted') {
          showToast("🟢 نوٹیفکیشن ایکٹیو ہو گئے ہیں!");
        } else {
          showToast("⚠️ نوٹیفکیشن بلاک ہیں", true);
        }
      });
    }
  }

  // Friendly Confirmation Message button
  window.sendConfirmationMsg = function(phone, code) {
    let cleanPhone = phone.replace(/[^0-9]/g, "");
    if (cleanPhone.startsWith("0")) { cleanPhone = "92" + cleanPhone.slice(1); }

    const msg = 
`السلام علیکم! ایس جے فوڈز آن لائن میں خوش آمدید 🌿۔

آپ نے جو سامان سلیکٹ کیا ہے، کیا آپ اپنے اس آرڈر [${code}] کی تصدیق کرنا چاہتے ہیں تاکہ ہم فوراً آپ کے سامان کی ڈلیوری کی تیاری شروع کر دیں؟

براہ کرم اس میسج کا جواب دے کر یا 'OK' لکھ کر کنفرم کر دیں۔ شکریہ! ✨`;

    window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`, "_blank");
  }

  // Thermal Printer Function
  window.printThermalReceipt = function(code) {
    let o = latestOrdersCache.find(x => x.code === code);
    if(!o) return;
    let printDiv = document.getElementById('printableReceipt');
    printDiv.style.display = 'block';
    printDiv.innerHTML = `
      <div style="text-align:center; font-weight:bold; font-size:18px; margin-bottom:5px;">SJ FOODS ONLINE</div>
      <div style="text-align:center; font-size:12px; margin-bottom:10px;">Al Basit Plaza, Haji Baba Road, Mingora Swat</div>
      <hr style="border-top:1px dashed #000;">
      <div style="font-size:13px;"><b>Order ID:</b> ${o.code}</div>
      <div style="font-size:13px;"><b>OTP Code:</b> ${o.otpCode}</div>
      <div style="font-size:13px;"><b>Time:</b> ${o.displayTime}</div>
      <div style="font-size:13px;"><b>Name:</b> ${o.name}</div>
      <div style="font-size:13px;"><b>Phone:</b> ${o.phone}</div>
      <div style="font-size:13px;"><b>Address:</b> ${o.address}</div>
      <hr style="border-top:1px dashed #000;">
      <div style="font-size:13px;"><b>Items:</b><br>${o.itemsSummary}</div>
      <hr style="border-top:1px dashed #000;">
      <div style="font-size:15px; font-weight:bold; text-align:center;">Total: Rs. ${o.total}</div>
      <hr style="border-top:1px dashed #000;">
      <div style="text-align:center; font-size:12px; margin-top:10px;">شکریہ! دوبارہ تشریف لائیں۔</div>
    `;
    window.print();
    setTimeout(() => { printDiv.style.display = 'none'; }, 1000);
  }

  let activeAccordionId = null;
  window.toggleAccordion = function(id){
    if(activeAccordionId === id) activeAccordionId = null;
    else activeAccordionId = id;
    renderOrdersDOM();
  }

  let latestOrdersCache = [];
  let cachedOrdersCount = 0;

  const ordersRef = ref(db, 'orders');
  onValue(ordersRef, (snapshot) => {
    const data = snapshot.val() || {};
    let dataList = Object.values(data);

    let pendingOrders = [];
    let completedOrders = [];

    dataList.forEach((row, index) => {
      let codeVal = row.code;
      if(codeVal){
        let st = String(row.status || 'pending').toLowerCase().trim();
        let itemObj = {
          id: "fb_" + index,
          code: codeVal,
          name: row.name || "Unknown",
          phone: row.phone || "03000000000",
          address: row.address || "Mingora Swat",
          itemsSummary: row.items || "",
          total: parseFloat(row.total || 0) || 0,
          otpCode: row.otp || String(codeVal).replace("SJ-", ""),
          displayTime: row.timestamp ? String(row.timestamp).replace(/^'/, '') : "N/A",
          status: st
        };

        if(st === 'completed') completedOrders.push(itemObj);
        else pendingOrders.push(itemObj);
      }
    });

    pendingOrders.reverse();
    completedOrders.reverse();
    latestOrdersCache = [...pendingOrders, ...completedOrders];

    let totalSales = 0;
    let pendingCount = 0;
    latestOrdersCache.forEach(o => {
      if(o.status === 'completed') totalSales += o.total;
      else pendingCount++;
    });

    document.getElementById("statTotalOrders").textContent = latestOrdersCache.length;
    document.getElementById("statPendingOrders").textContent = pendingCount;
    document.getElementById("statTotalSales").textContent = "Rs. " + totalSales.toLocaleString();

    if(latestOrdersCache.length > cachedOrdersCount && cachedOrdersCount !== 0){
      playLoudBeep();
      showToast("🔔 نیا آرڈر موصول ہوا ہے!");
    }
    cachedOrdersCount = latestOrdersCache.length;

    renderOrdersDOM();
  });

  window.renderOrdersDOM = function(){
    const area = document.getElementById("ordersArea");
    const orders = latestOrdersCache;

    if(orders.length === 0){
      area.innerHTML = `<div style="text-align:center; color:var(--muted); padding:30px;">کوئی آرڈر موجود نہیں</div>`;
      return;
    }

    area.innerHTML = orders.map((o) => {
      let isOpen = (activeAccordionId === o.id);
      let isCompleted = (o.status === 'completed');
      let cleanPhoneForWA = o.phone.replace(/[^0-9]/g, '');
      if(cleanPhoneForWA.startsWith('0')) cleanPhoneForWA = '92' + cleanPhoneForWA.slice(1);

      return `
        <div class="chat-item ${isCompleted ? 'completed' : 'pending'} ${isOpen ? 'open' : ''}" id="card-${o.id}">
          <div class="chat-header" onclick="toggleAccordion('${o.id}')">
            <span style="font-size:13.5px; direction:auto;">
              📌 ${o.code} — ${o.name}
              ${!isCompleted ? `<span class="challenge-tag">ڈلیوری باقی</span>` : ''}
            </span>
            <div style="display:flex; align-items:center; gap:4px;">
              <span class="time-badge ${isCompleted ? 'done' : ''}">
                ${isCompleted ? '✅ گرین (مکمل)' : '⏳ بلنکنگ ریڈ'}
              </span>
            </div>
          </div>
          <div class="chat-body" dir="auto">
            <div style="font-size:13.5px; line-height:1.7;">
              Phone: <span dir="ltr">${o.phone}</span> 
              <a href="tel:${o.phone}" style="text-decoration:none; margin-right:6px; font-weight:bold; color:var(--mid);">📞 Call</a>
              <a href="https://wa.me/${cleanPhoneForWA}" target="_blank" style="text-decoration:none; margin-right:6px; font-weight:bold; color:#25D366;">💬 WhatsApp</a><br>
              Address: ${o.address}<br>
              OTP Code: <b style="color:var(--price); font-size:15px;" dir="ltr">${o.otpCode}</b><br>
              Order Time: <b>${o.displayTime}</b><br>
              Items Details: <div style="background:#F9F8F3; padding:8px; border-radius:8px; margin-top:4px;" dir="auto">${o.itemsSummary}</div>
              Total Amount: <b>Rs. ${o.total}</b><br>
              Status: <b>${isCompleted ? 'Completed' : 'Pending Delivery'}</b>
            </div>
            
            <div style="margin-top:12px; display:flex; gap:5px; flex-wrap:wrap;">
              ${!isCompleted ? `
                <button class="btn-secondary" style="background:#E8EAF6; color:#1A237E;" onclick="sendConfirmationMsg('${o.phone}', '${o.code}')">💬 تصدیق</button>
              ` : ''}
              <button class="btn-secondary" style="background:#FFF3CD; color:#856404;" onclick="printThermalReceipt('${o.code}')">🖨️ پرنٹ</button>
              ${!isCompleted ? `
                <button class="btn-secondary" style="background:#C8E6C9; color:#1B5E20; font-weight:700;" onclick="completeOrderAndThank('${o.code}', '${o.phone}')">✅ ڈلیوری مکمل ہو گئی</button>
              ` : `<div style="width:100%; text-align:center; font-size:12px; color:var(--mid); font-weight:700; margin-top:4px;">🔒 آرڈر ڈلیور اور مکمل ہو چکا ہے</div>`}
            </div>
          </div>
        </div>
      `;
    }).join("");
  }

  window.completeOrderAndThank = async function(code, phone){
    if(!confirm("کیا آپ اس آرڈر کی ڈلیوری مکمل کرنا چاہتے ہیں؟")) return;
    
    try {
      await update(ref(db, 'orders/' + code), { status: "completed" });
    } catch(e){}

    const msg = `السلام علیکم! محترم صارف، آپ کا آرڈر [${code}] کامیابی سے ڈلیور ہو چکا ہے۔ SJ Foods Online کا شکریہ! 🌿`;
    
    let cleanPhone = phone.replace(/[^0-9]/g, "");
    if(cleanPhone.startsWith("0")) cleanPhone = "92" + cleanPhone.slice(1);
    
    window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`, "_blank");
    showToast("✅ آرڈر مکمل (Green) ہو گیا ہے!");
  }
</script>
</body>
</html>
