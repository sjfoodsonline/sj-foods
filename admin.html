<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SJ Foods — Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Jameel+Noori+Nastaleeq&display=swap" rel="stylesheet">
<style>
  :root { --dark: #153A20; --mid: #2E7D32; --light: #E8F5E9; --bg: #F4F7F6; --danger: #D32F2F; --save-btn: #1B5E20; }
  * { box-sizing: border-box; font-family: Arial, sans-serif; }
  body { background: var(--bg); margin: 0; padding: 0 0 60px 0; direction: rtl; text-align: right; }
  
  header { background: var(--dark); color: #fff; padding: 15px 20px; text-align: center; border-bottom: 4px solid var(--mid); position: sticky; top: 0; z-index: 100; }
  header h1 { margin: 0; font-family: "Jameel Noori Nastaleeq", serif; font-size: 26px; }
  header p { margin: 3px 0 0; font-size: 12px; opacity: 0.9; }

  .top-action-bar {
    background: #fff; border-bottom: 2px solid #ddd; padding: 10px 20px; position: sticky; top: 65px; z-index: 99;
    display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .top-action-bar button, .top-action-bar .btn-link {
    padding: 8px 16px; font-size: 14px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; text-decoration: none; color: #fff;
  }
  .btn-save-top { background: var(--save-btn) !important; font-family: Arial, sans-serif; }
  .btn-back-top { background: #555 !important; font-family: Arial, sans-serif; }

  .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
  
  .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
  .tab-btn { flex: 1; padding: 12px; background: #fff; border: 1.5px solid #ccc; border-radius: 10px; font-weight: bold; cursor: pointer; text-align: center; color: var(--dark); font-size: 15px; }
  .tab-btn.active { background: var(--dark); color: #fff; border-color: var(--dark); }

  .panel-section { display: none; }
  .panel-section.active { display: block; }

  .bell-box { background: #fff; border: 1.5px solid #ddd; border-radius: 12px; padding: 15px; text-align: center; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
  .bell-box h3 { margin: 0 0 10px; color: var(--dark); font-family: "Jameel Noori Nastaleeq", serif; font-size: 22px; }

  .order-card { background: #FFF3E0; border: 2px solid #FFB74D; border-radius: 12px; padding: 15px; margin-bottom: 15px; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
  .order-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #FFCC80; padding-bottom: 8px; margin-bottom: 10px; }
  .order-code { font-weight: bold; font-size: 18px; color: #E65100; }
  .order-time { font-size: 12px; color: #666; }

  .order-details p { margin: 6px 0; font-size: 14px; font-weight: bold; color: #333; }
  .order-details span { font-weight: normal; color: #000; }
  .otp-code { font-size: 18px; font-weight: bold; color: var(--danger); background: #FFCDD2; padding: 2px 8px; border-radius: 6px; }

  .items-box { background: #fff; border: 1px dashed #ccc; padding: 10px; border-radius: 8px; margin: 10px 0; font-size: 13px; line-height: 1.6; font-family: "Jameel Noori Nastaleeq", serif; }
  .total-price { font-size: 18px; font-weight: bold; color: var(--dark); text-align: left; margin-top: 10px; }

  .actions { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
  .btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; text-align: center; color: #fff; font-family: "Jameel Noori Nastaleeq", serif; font-size: 16px; }
  .btn-print { background: #FF9800; color: #000; }
  .btn-close { background: var(--mid); }
  .btn-delete { background: var(--danger); flex: 0 0 60px; }
  
  .empty-msg { text-align: center; color: #777; font-size: 20px; margin-top: 40px; font-family: "Jameel Noori Nastaleeq", serif; }
</style>
</head>
<body>

<header>
  <h1>⚙️ ایس جے فوڈز — ایڈمن پینل</h1>
  <p>Live Orders Management & Inventory Control</p>
</header>

<div class="top-action-bar">
  <button class="btn-back-top" onclick="history.back()">⬅ Back</button>
  <div style="font-size: 13px; font-weight: bold; color: var(--dark);" id="saveStatusIndicator">🟢 Changes Synced</div>
  <button class="btn-save-top" onclick="saveAllChanges()">💾 Save Changes</button>
</div>

<div class="container">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('ordersTab', this)">📦 Live Orders</button>
    <button class="tab-btn" onclick="switchTab('productsTab', this)">🛒 Products & Stock</button>
  </div>

  <!-- ORDERS PANEL -->
  <div id="ordersTab" class="panel-section active">
    <div class="bell-box">
      <h3>🔔 Live Orders Inbox</h3>
      <p style="font-size:12px; color:#555; margin:0;">New customer orders appear here automatically.</p>
    </div>
    <div id="ordersContainer"></div>
  </div>

  <!-- PRODUCTS PANEL -->
  <div id="productsTab" class="panel-section">
    <div class="bell-box">
      <h3>🛒 Products & Inventory Management</h3>
      <p style="font-size:12px; color:#555; margin:0;">Update stock availability, prices, or remove items securely.</p>
    </div>
    <div id="productsContainer">
      <div style="background:#fff; padding:20px; border-radius:12px; text-align:center;">
        <p style="font-weight:bold; color:var(--dark);">Manage categories and stock items here.</p>
        <button class="btn" style="background:var(--mid); width:auto; padding:10px 20px; margin-top:10px;" onclick="saveAllChanges()">Save Changes</button>
      </div>
    </div>
  </div>
</div>

<script>
  function switchTab(tabId, btn) {
    document.querySelectorAll('.panel-section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
  }

  function loadOrders() {
    const container = document.getElementById("ordersContainer");
    let orders = JSON.parse(localStorage.getItem("sj_local_orders") || "[]");
    let pendingOrders = orders.filter(o => o.status !== "completed");

    if (pendingOrders.length === 0) {
      container.innerHTML = `<div class="empty-msg">اس وقت کوئی نیا آرڈر موجود نہیں ہے۔ سکون کریں! ☕</div>`;
      return;
    }

    let html = "";
    pendingOrders.forEach((order) => {
      html += `
        <div class="order-card" id="order_${order.id}">
          <div class="order-header">
            <div class="order-code">📌 ${order.code} — ${order.name}</div>
            <div class="order-time">${order.date}</div>
          </div>
          <div class="order-details">
            <p>📞 فون: <span><a href="tel:${order.phone}" style="color:var(--mid); text-decoration:none;">${order.phone}</a></span></p>
            <p>📍 پتہ / ڈلیوری: <span>${order.address}</span></p>
            <p>🔐 ڈلیوری (OTP) کوڈ: <span class="otp-code">${order.otpCode}</span></p>
            <div class="items-box">${order.itemsSummary}</div>
            <div class="total-price">کل رقم: Rs. ${order.total}</div>
          </div>
          <div class="actions">
            <button class="btn btn-delete" onclick="deleteOrder('${order.id}')" title="Delete">🗑️</button>
            <button class="btn btn-print" onclick="printThermal('${order.id}')">🖨️ Thermal Print</button>
            <button class="btn btn-close" onclick="closeOrder('${order.id}')">✅ Order Delivered & Thank You</button>
          </div>
        </div>
      `;
    });
    container.innerHTML = html;
  }

  function printThermal(orderId) {
    let orders = JSON.parse(localStorage.getItem("sj_local_orders") || "[]");
    let order = orders.find(o => o.id === orderId);
    if(!order) return;

    let printWindow = window.open('', '', 'width=300,height=600');
    printWindow.document.write(`
      <html><head><title>Print Receipt</title>
      <style>
        body { font-family: 'Arial', sans-serif; width: 58mm; margin: 0 auto; padding: 5px; color: #000; direction: rtl; text-align: right; }
        h2 { text-align: center; font-size: 16px; margin: 0 0 5px; border-bottom: 1px dashed #000; padding-bottom: 5px; }
        p { font-size: 12px; margin: 3px 0; }
        .items { font-size: 11px; margin-top: 10px; border-top: 1px dashed #000; padding-top: 5px; }
        .total { font-weight: bold; font-size: 14px; text-align: left; border-top: 1px dashed #000; margin-top: 5px; padding-top: 5px; }
        .footer { text-align: center; font-size: 10px; margin-top: 10px; border-top: 1px dashed #000; padding-top: 5px; }
      </style>
      </head><body>
        <h2>SJ Foods Online</h2>
        <p><b>آرڈر:</b> ${order.code}</p>
        <p><b>نام:</b> ${order.name}</p>
        <p><b>فون:</b> ${order.phone}</p>
        <p><b>پتہ:</b> ${order.address}</p>
        <p><b>OTP کوڈ:</b> ${order.otpCode}</p>
        <div class="items">${order.itemsSummary.replace(/<br>/g, '<br>')}</div>
        <div class="total">Total: Rs. ${order.total}</div>
        <div class="footer">
          ڈلیوری چارجز موقع پر طے شدہ وصول کیے جائیں گے۔<br>
          شکریہ!
        </div>
      </body></html>
    `);
    printWindow.document.close();
    printWindow.focus();
    setTimeout(() => { printWindow.print(); printWindow.close(); }, 500);
  }

  function closeOrder(orderId) {
    let orders = JSON.parse(localStorage.getItem("sj_local_orders") || "[]");
    let orderIndex = orders.findIndex(o => o.id === orderId);
    
    if(orderIndex !== -1) {
      let order = orders[orderIndex];
      order.status = "completed";
      localStorage.setItem("sj_local_orders", JSON.stringify(orders));
      
      let phone = order.phone;
      if(phone.startsWith('0')) { phone = "92" + phone.substring(1); }
      
      let msg = `🌟 *SJ Foods Online — آرڈر مکمل* [${order.code}]\n\n`;
      msg += `محترم *${order.name}* صاحب،\n`;
      msg += `آپ کا آرڈر کامیابی کے ساتھ ڈلیور کر دیا گیا ہے۔ امید ہے آپ کو ہماری سروس اور اشیاء کا معیار پسند آیا ہوگا۔\n\n`;
      msg += `ہمیں آپ کی خدمت کا موقع دینے کا بے حد شکریہ! 🌿\n`;
      msg += `اگلی بار مزید بہتری کے ساتھ آپ کی خدمت کے لیے حاضر ہوں گے۔ دعاؤں میں یاد رکھیں۔`;

      window.open(`https://web.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(msg)}`, "_blank");
      loadOrders();
    }
  }

  function deleteOrder(orderId) {
    if(confirm("Are you sure you want to delete this order?")) {
      let orders = JSON.parse(localStorage.getItem("sj_local_orders") || "[]");
      orders = orders.filter(o => o.id !== orderId);
      localStorage.setItem("sj_local_orders", JSON.stringify(orders));
      loadOrders();
    }
  }

  function saveAllChanges() {
    document.getElementById("saveStatusIndicator").textContent = "💾 Saved Successfully!";
    setTimeout(() => {
      document.getElementById("saveStatusIndicator").textContent = "🟢 Changes Synced";
    }, 2500);
  }

  setInterval(loadOrders, 5000);
  window.onload = loadOrders;
</script>
</body>
</html>
