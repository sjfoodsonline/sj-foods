<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SJ Foods Mingora — تازہ سبزیاں، پھل، کریانہ آن لائن آرڈر | Swat</title>
<meta name="description" content="SJ Foods Mingora Swat — تازہ سبزیاں، پھل، کریانہ، بیکری، دودھ و ڈیری اور روزمرہ اشیاء گھر بیٹھے آرڈر کریں۔">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --dark:#153A20;
    --mid:#2E7D32;
    --leaf:#E8F5E9;
    --accent:#FF6F00;
    --gold:#C9A227;
    --paper:#FFFDF8;
    --ink:#20241F;
    --muted:#8A8F86;
    --price:#B71C1C;
    --line:#E5E4DA;
    --card:#FFFFFF;
    --app-w: 480px;
  }
  body.dark{
    --paper:#0F1A12;
    --ink:#EAF3EA;
    --muted:#9AA79A;
    --line:#233826;
    --card:#17251A;
    --leaf:#16301C;
  }
  body.dark .item, body.dark #billbar, body.dark .checkout-box input{ background:var(--card); color:var(--ink); }
  body.dark .chip{background:var(--card); border-color:var(--line);}
  body.dark #search{background:var(--card); color:var(--ink); border-color:var(--line);}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,"Noto Naskh Arabic",sans-serif;
    direction:rtl; padding-bottom:90px;
  }
  @media (min-width: 640px){
    html{ background:#EDEAE0; }
    body{ max-width:var(--app-w); margin:0 auto; min-height:100vh; box-shadow:0 0 50px rgba(0,0,0,0.18); }
    #billbar{ left:50%; right:auto; width:100%; max-width:var(--app-w); transform:translateX(-50%); }
  }
  header{
    background:linear-gradient(160deg,var(--dark),var(--mid));
    color:#fff; padding:18px 16px 16px; border-radius:0 0 22px 22px;
    box-shadow:0 6px 18px rgba(21,58,32,0.25); position:relative; overflow:hidden;
  }
  header h1{margin:0 0 4px; font-size:22px; font-weight:700; font-family:"Noto Nastaliq Urdu",serif;}
  header p{margin:0; font-size:12.5px; opacity:.92;}

  .top-ticker {
    width: 100%; overflow: hidden; white-space: nowrap;
    background: #1b5e20; color: white; padding: 8px 0; font-size: 13px; font-weight: 600;
  }
  .top-ticker-content {
    display: inline-block; padding-right: 100%; animation: ticker-rtl 22s linear infinite;
  }
  @keyframes ticker-rtl {
    0% { transform: translate3d(0, 0, 0); }
    100% { transform: translate3d(100%, 0, 0); }
  }

  .search-wrap{padding:14px 16px 4px; position:sticky; top:0; background:var(--paper); z-index:20;}
  #search{
    width:100%; padding:12px 14px; font-size:15px; border-radius:14px;
    border:1.5px solid var(--line); background:#fff; outline:none;
  }

  /* Camera & Upload Options */
  .upload-btn-wrap {
    padding: 6px 16px; display: flex; gap: 8px; justify-content: center;
  }
  .upload-btn {
    flex:1; background: var(--mid); color: #fff; padding: 10px; border-radius: 10px;
    text-align: center; font-weight: bold; font-size: 13px; cursor: pointer; display: flex;
    align-items: center; justify-content: center; gap: 6px;
  }

  .categories-container {
    display: flex; gap: 10px; overflow-x: auto; padding: 12px 16px;
    scroll-behavior: smooth; position: sticky; top: 52px; background: var(--paper); z-index: 19;
  }
  .chip{
    flex:0 0 auto; background:var(--leaf); color:var(--dark); border:1px solid #cfe8d1;
    border-radius:20px; padding:8px 16px; font-size:13px; font-weight:700; cursor:pointer;
  }
  .chip.active{ background: var(--dark); color: #fff; }

  main{padding:6px 16px 10px;}
  .cat-title{ font-size:16px; font-weight:700; color:var(--dark); margin:20px 2px 8px; padding-right:10px; border-right:4px solid var(--dark); }
  .item{
    display:flex; flex-direction:column; gap:8px; background:#fff; border:1px solid var(--line);
    border-radius:14px; padding:10px 12px; margin-bottom:8px;
  }
  .item-row-top{display:flex; align-items:center; gap:10px;}
  .item-row-bottom{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .item .info{flex:1;}
  .item .name{font-size:15.5px; font-weight:600;}

  /* Image Slider / Multiple Thumbnails Support */
  .item-thumbs-container { display: flex; gap: 4px; overflow-x: auto; max-width: 100px; }
  .item-thumb{
    flex:0 0 68px; width:68px; height:68px; border-radius:12px; background:#f8f9fa;
    display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:pointer; border:1px solid var(--line);
  }
  .item-thumb img{width:100%; height:100%; object-fit:contain;}

  .qty-box{display:flex; align-items:center; gap:6px;}
  .qty-box button{ width:32px; height:32px; border-radius:9px; border:none; background:var(--leaf); color:var(--dark); font-size:18px; font-weight:700; cursor:pointer; }
  .qty-box button.plus{background:var(--dark); color:#fff;}
  .qty-box input{ width:38px; text-align:center; border:1px solid var(--line); border-radius:8px; font-size:15px; font-weight:700; padding:5px 2px; }

  #billbar{
    position:fixed; right:0; left:0; bottom:0; background:#fff; border-top:1.5px solid var(--line);
    border-radius:20px 20px 0 0; box-shadow:0 -8px 24px rgba(0,0,0,0.08); padding:14px 18px 18px;
    z-index: 30; display:flex; flex-direction:column;
  }
  #billbar.collapsed .cart-details{display:none;}
  .bill-summary{display:flex; align-items:center; justify-content:space-between; cursor:pointer;}
  .bill-summary .total{font-size:25px; font-weight:800; color:var(--dark);}

  /* Lightbox Modal & Gallery */
  .lightbox{
    position:fixed; inset:0; background:rgba(0,0,0,0.88); z-index:90;
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px;
  }
  .lightbox.hidden{display:none;}
  .lightbox img{ max-width:95%; max-height:70vh; border-radius:12px; object-fit:contain; }
  .lightbox-gallery { display: flex; gap: 8px; margin-top: 12px; overflow-x: auto; max-width: 90%; }
  .lightbox-gallery img { width: 50px; height: 50px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
  .lightbox-gallery img.active-gallery { border-color: var(--accent); }
  .lightbox-close{ position:absolute; top:20px; left:20px; background:#fff; border:none; border-radius:50%; width:40px; height:40px; font-size:20px; cursor:pointer; }

  .actions{display:flex; gap:8px; margin-top:10px;}
  .actions button{ flex:1; border:none; border-radius:12px; padding:12px; font-size:14px; font-weight:700; cursor:pointer; }
  #waBtn{background:#25D366; color:#fff;}
</style>
</head>
<body>

<div class="top-ticker">
  <div class="top-ticker-content">
    خوش آمدید! SJ Foods سے تازہ ترین سبزیاں، پھل اور گروسری مناسب ترین قیمتوں پر حاصل کریں!
  </div>
</div>

<header>
  <h1>🟢 ایس جے فوڈز مینگورہ سوات</h1>
  <p>تازہ سبزیاں، پھل، کریانہ اور روزمرہ اشیاء آن لائن آرڈر کریں</p>
</header>

<div class="search-wrap">
  <input id="search" type="text" placeholder="🔍 آئٹم تلاش کریں... مثلاً ٹماٹر">
</div>

<!-- ڈائریکٹ کیمرہ اور گیلری اپ لوڈ آپشن -->
<div class="upload-btn-wrap">
  <label class="upload-btn">
    📷 ڈائریکٹ کیمرہ کھولیں
    <input type="file" accept="image/*" capture="environment" id="cameraInput" style="display:none;">
  </label>
  <label class="upload-btn" style="background:var(--dark);">
    🖼️ گیلری سے منتخب کریں
    <input type="file" accept="image/*" id="galleryInput" style="display:none;">
  </label>
</div>

<div class="categories-container" id="chips"></div>

<main id="list"></main>

<div id="billbar" class="collapsed">
  <div class="bill-summary" id="summary">
    <div>🛒 کارٹ آئٹمز</div>
    <div class="total" id="summaryTotal">Rs. 0</div>
  </div>
  <div class="cart-details">
    <div class="actions">
      <button id="waBtn">✅ واٹس ایپ پر آرڈر بھیجیں</button>
    </div>
  </div>
</div>

<!-- Image Lightbox Modal with Multiple Image Support -->
<div class="lightbox hidden" id="lightbox">
  <button class="lightbox-close" id="closeLightbox">✕</button>
  <img id="lightboxImg" src="" alt="پروڈکٹ کی تصویر">
  <div class="lightbox-gallery" id="lightboxGallery"></div>
</div>

<script>
let CATEGORIES_META = [];
let ITEMS = [];

function fmt(n){ return "Rs. " + Math.round(n).toLocaleString("en-US"); }

// ملٹیپل امیجز کو سپورٹ کرنے کے لیے فنکشن میں تبدیلی
function buildItemsFromCategories(catData){
  let items = [];
  catData.forEach((cat, ci) => {
    cat.items.forEach((it, ii) => {
      // اگر images کی ایرے ہو تو وہ لے لے، ورنہ single image لے
      let imgList = [];
      if(Array.isArray(it.images) && it.images.length > 0){
        imgList = it.images;
      } else if(it.image){
        imgList = [it.image];
      }

      items.push({
        id: ci+"-"+ii, cat: cat.category, icon: cat.icon,
        name: it.name, name_roman: it.name_roman || "",
        units: (it.units && it.units.length) ? it.units : [{label: it.unit, rate: it.rate}],
        unitIndex: 0, available: it.available !== false,
        images: imgList, // تصاویر کی لسٹ
        qty: 0
      });
    });
  });
  return items;
}

async function loadRates(){
  try{
    const idxRes = await fetch("categories_index.json", {cache:"no-store"});
    const index = await idxRes.json();
    const catResults = await Promise.all(
      index.map(entry => fetch(entry.file, {cache:"no-store"}).then(r=>r.json()))
    );

    CATEGORIES_META = index.map(entry => ({name: entry.category, icon: entry.icon}));
    const combined = index.map((entry, i) => ({
      category: entry.category, icon: entry.icon, items: catResults[i]
    }));
    ITEMS = buildItemsFromCategories(combined);
    renderChips();
    renderList("");
  }catch(e){ console.error(e); }
}

function renderChips(){
  const chipsEl = document.getElementById("chips");
  chipsEl.innerHTML = "";
  CATEGORIES_META.forEach((cat, idx)=>{
    const chip = document.createElement("div");
    chip.className = "chip" + (idx === 0 ? " active" : "");
    chip.textContent = cat.icon + " " + cat.name;
    chipsEl.appendChild(chip);
  });
}

function renderList(filter){
  const listEl = document.getElementById("list");
  listEl.innerHTML = "";

  CATEGORIES_META.forEach(cat=>{
    const catItems = ITEMS.filter(it=> it.cat===cat.name);
    if(catItems.length===0) return;

    const title = document.createElement("div");
    title.className = "cat-title";
    title.textContent = cat.icon + " " + cat.name;
    listEl.appendChild(title);

    catItems.forEach(it=>{
      const row = document.createElement("div");
      row.className = "item";

      // ملٹیپل تھمب نیلز بنانے کا طریقہ
      let thumbHtml = "";
      if(it.images.length > 0){
        thumbHtml = `<div class="item-thumbs-container">` + 
          it.images.map(img => `<div class="item-thumb" onclick='openLightbox(${JSON.stringify(it.images)}, "${img}")'><img src="${img}"></div>`).join("") + 
          `</div>`;
      } else {
        thumbHtml = `<div class="item-thumb"><span>${it.icon||'🛒'}</span></div>`;
      }

      row.innerHTML = `
        <div class="item-row-top">
          ${thumbHtml}
          <div class="info">
            <div class="name">${it.name}</div>
            <div>${fmt(it.units[0].rate)} / ${it.units[0].label}</div>
          </div>
        </div>`;
      listEl.appendChild(row);
    });
  });
}

/* Lightbox with Gallery Support */
function openLightbox(imgArray, activeImg) {
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightboxImg");
  const galleryContainer = document.getElementById("lightboxGallery");

  lightboxImg.src = activeImg;
  galleryContainer.innerHTML = "";

  if(imgArray.length > 1) {
    imgArray.forEach(imgSrc => {
      const gImg = document.createElement("img");
      gImg.src = imgSrc;
      if(imgSrc === activeImg) gImg.classList.add("active-gallery");
      gImg.onclick = () => {
        lightboxImg.src = imgSrc;
        document.querySelectorAll(".lightbox-gallery img").forEach(i => i.classList.remove("active-gallery"));
        gImg.classList.add("active-gallery");
      };
      galleryContainer.appendChild(gImg);
    });
  }
  lightbox.classList.remove("hidden");
}

document.getElementById("closeLightbox").onclick = () => {
  document.getElementById("lightbox").classList.add("hidden");
};

// کیمرہ اور فائل اپ لوڈ ایونٹ ہینڈلرز
document.getElementById("cameraInput").addEventListener("change", handleFileUpload);
document.getElementById("galleryInput").addEventListener("change", handleFileUpload);

function handleFileUpload(e) {
  const file = e.target.files[0];
  if(file) {
    alert("تصویر کامیابی سے منتخب ہو گئی: " + file.name);
  }
}

loadRates();
</script>
</body>
</html>
