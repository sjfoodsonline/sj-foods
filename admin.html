<!DOCTYPE html>
<html lang="ur" dir="rtl" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>SJ Foods — مکمل ایڈمن پینل و مینجمنٹ</title>
<link href="https://fonts.googleapis.com/css2?family=Jameel+Noori+Nastaleeq&display=swap" rel="stylesheet">
<style>
  :root{ --dark:#153A20; --mid:#2E7D32; --leaf:#E8F5E9; --paper:#FFFDF8; --ink:#20241F; --muted:#8A8F86; --line:#E5E4DA; --price:#B71C1C; }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; direction:rtl; padding-bottom:70px;}
  header{background:linear-gradient(160deg,var(--dark),var(--mid)); color:#fff; padding:18px 16px; border-radius:0 0 20px 20px;}
  header h1{margin:0; font-size:18px; font-family:"Jameel Noori Nastaleeq",serif;}
  
  .wrap{padding:14px;}
  .card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:0 2px 8px rgba(0,0,0,0.03);}
  .card h3{margin:0 0 8px; font-size:15px; color:var(--dark); font-family:"Jameel Noori Nastaleeq",serif;}
  
  input[type=text], input[type=password], input[type=number], select{
    width:100%; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px; font-family:inherit; direction:rtl; margin-bottom:8px; background:#fff;
  }
  label{font-size:12px; color:var(--muted); display:block; margin-bottom:3px;}
  button{cursor:pointer; border:none; font-family:inherit;}
  .btn{background:var(--dark); color:#fff; border-radius:10px; padding:11px 16px; font-size:14px; font-weight:700; width:100%;}
  .btn-success{background:#E8F5E9; color:#1B5E20; border:1px solid var(--mid); border-radius:10px; padding:9px 12px; font-weight:700;}
  .btn-danger{background:#FFEBEE; color:#B71C1C; border-radius:10px; padding:6px 12px; font-size:12px; font-weight:700;}
  
  .tabs{display:flex; gap:8px; margin-bottom:14px;}
  .tab{flex:1; padding:11px; text-align:center; background:#fff; border:1.5px solid var(--line); border-radius:10px; font-weight:700; font-size:13px; color:var(--muted); cursor:pointer;}
  .tab.active{background:var(--dark); color:#fff; border-color:var(--dark);}

  .order-card{background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; position:relative;}
  .order-card.pending{animation: blink 1.8s infinite;}
  .order-card.completed{background:#F1F8E9; border-color:#81C784;}
  @keyframes blink{ 0%{border-color:#E53935;background:#FFEBEE;} 50%{border-color:#FFE082;background:#FFFDE7;} 100%{border-color:#E53935;background:#FFEBEE;} }
  
  .product-row{background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; display:flex; flex-direction:column; gap:8px;}
  .toast{position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--dark); color:#fff; padding:10px 20px; border-radius:24px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:150;}
  .toast.show{opacity:1;}
</style>
</head>
<body translate="no">

<header>
  <h1>⚙️ SJ Foods — مکمل ایڈمن پینل و مینجمنٹ</h1>
</header>

<div class="wrap">
  
  <div class="card" id="setupCard">
    <h3>🔑 گিট ہب (GitHub) سیٹ اپ</h3>
    <label>يوزر نیم</label><input type="text" id="cfgOwner" value="sjfoodsonline">
    <label>ریپازٹری نام</label><input type="text" id="cfgRepo" value="sj-foods">
    <label>ٹوکن (Token)</label><input type="password" id="cfgToken" placeholder="ghp_xxxxxxxx">
    <button class="btn" onclick="saveCfg()">محفوظ کریں</button>
  </div>

  <div id="adminPanel" style="display:none;">
    <div class="tabs">
      <div class="tab active" id="tabOrdersBtn" onclick="switchTab('orders')">🔔 لائیو آرڈرز</div>
      <div class="tab" id="tabProductsBtn" onclick="switchTab('products')">📦 پروڈکٹس اور ریٹس</div>
    </div>

    <div id="secOrders">
      <div class="card">
        <h3>🔔 کسٹمرز کے آرڈرز</h3>
        <div style="display:flex; gap:8px; margin-top:8px;">
          <button class="btn" style="background:var(--leaf); color:var(--dark); font-size:12.5px;" onclick="testSound()">🔊 بیل ٹیسٹ</button>
          <button class="btn" style="background:#E8F5E9; color:#1B5E20; font-size:12.5px;" onclick="fakeOrder()">🧪 فرضی آرڈر</button>
          <button class="btn" style="background:#FFEBEE; color:#B71C1C; font-size:12.5px;" onclick="clearAllOrders()">🗑️ صاف کریں</button>
        </div>
      </div>
      <div id="ordersArea"></div>
    </div>

    <div id="secProducts" style="display:none;">
      <div class="card">
        <label>کیٹگری منتخب کریں:</label>
        <select id="catSelect" onchange="loadCategoryProducts()"></select>
      </div>

      <div id="productsArea"></div>
      <button class="btn" style="background:var(--mid); margin-top:12px;" onclick="addNewProduct()">➕ نیا پروڈکٹ شامل کریں</button>
      <button class="btn" style="margin-top:12px;" onclick="saveGitHubChanges()">💾 تمام تبدیلیاں گিট ہب پر محفوظ کریں</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
let CFG = null;
let CATEGORIES_INDEX = [];
let currentFile = "";
let currentItems = [];
let currentSha = "";

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=> t.classList.remove("show"), 2000);
}

function playSound(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.6);
  }catch(e){}
}
function testSound(){ playSound(); showToast("🔊 ساؤنڈ ایکٹیو ہے"); }

function saveCfg(){
  const owner = document.getElementById("cfgOwner").value.trim();
  const repo = document.getElementById("cfgRepo").value.trim();
  const token = document.getElementById("cfgToken").value.trim();
  if(!owner || !repo || !token){ showToast("تمام خانے پُر کریں"); return; }
  CFG = {owner, repo, token};
  localStorage.setItem("sj_admin_cfg", JSON.stringify(CFG));
  initAdmin();
}

async function ghReq(path, options){
  const res = await fetch(`https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/${path}`, Object.assign({
    headers: {"Authorization": "token " + CFG.token, "Accept": "application/vnd.github+json"}
  }, options || {}));
  if(!res.ok) throw new Error("GitHub error");
  return res.json();
}

async function initAdmin(){
  const raw = localStorage.getItem("sj_admin_cfg");
  if(!raw) return;
  CFG = JSON.parse(raw);
  document.getElementById("setupCard").style.display = "none";
  document.getElementById("adminPanel").style.display = "block";
  renderOrders();

  try{
    const idx = await ghReq("categories_index.json");
    CATEGORIES_INDEX = JSON.parse(atob(idx.content.replace(/\n/g,"")));
    const sel = document.getElementById("catSelect");
    sel.innerHTML = CATEGORIES_INDEX.map(c => `<option value="${c.file}">${c.icon} ${c.category}</option>`).join("");
    loadCategoryProducts();
  }catch(e){
    showToast("❌ گিট ہب کنکشن ناکام یا ٹوکن غلط ہے");
  }
}

async function loadCategoryProducts(){
  currentFile = document.getElementById("catSelect").value;
  document.getElementById("productsArea").innerHTML = "⏳ لوڈ ہو رہا ہے...";
  try{
    const res = await ghReq(currentFile);
    currentSha = res.sha;
    currentItems = JSON.parse(atob(res.content.replace(/\n/g,"")));
    renderProductsEditor();
  }catch(e){
    document.getElementById("productsArea").innerHTML = "❌ لوڈنگ میں خرابی";
  }
}

function renderProductsEditor(){
  const area = document.getElementById("productsArea");
  area.innerHTML = currentItems.map((it, idx) => `
    <div class="product-row">
      <div style="display:flex; gap:8px;">
        <input type="text" value="${it.name}" placeholder="پروڈکٹ کا نام (اردو)" oninput="currentItems[${idx}].name=this.value" style="margin-bottom:0;">
        <button class="btn-danger" onclick="delProduct(${idx})">حذف</button>
      </div>
      <div style="display:flex; gap:8px;">
        <input type="text" value="${it.name_roman||''}" placeholder="Roman Urdu name (e.g. Tomato)" oninput="currentItems[${idx}].name_roman=this.value" style="margin-bottom:0; direction:ltr; text-align:left;">
      </div>
      <div style="display:flex; gap:8px; align-items:center;">
        <input type="text" value="${it.image||''}" placeholder="تصویر کا لنک (URL)" oninput="currentItems[${idx}].image=this.value" style="margin-bottom:0; font-size:12px;">
        <label style="display:flex; align-items:center; gap:4px; white-space:nowrap;"><input type="checkbox" ${it.available!==false?'checked':''} onchange="currentItems[${idx}].available=this.checked"> دستیاب</label>
        <label style="display:flex; align-items:center; gap:4px; white-space:nowrap;"><input type="checkbox" ${it.featured===true?'checked':''} onchange="currentItems[${idx}].featured=this.checked"> ⭐ نمایاں</label>
      </div>
      <div style="background:#f9f9f6; padding:8px; border-radius:8px; font-size:12.5px;">
        <b>یونٹس اور ریٹس:</b>
        ${(it.units || [{label: it.unit, rate: it.rate}]).map((u, ui) => `
          <div style="display:flex; gap:6px; margin-top:6px;">
            <input type="text" value="${u.label}" placeholder="یونٹ (مثلاً KG)" oninput="updateUnit(${idx}, ${ui}, 'label', this.value)" style="margin-bottom:0; padding:6px;">
            <input type="number" value="${u.rate}" placeholder="قیمت" oninput="updateUnit(${idx}, ${ui}, 'rate', this.value)" style="margin-bottom:0; padding:6px;">
          </div>
        `).join("")}
      </div>
    </div>
  `).join("");
}

function updateUnit(pi, ui, field, val){
  if(!currentItems[pi].units) currentItems[pi].units = [{label: "KG", rate: 0}];
  currentItems[pi].units[ui][field] = field === 'rate' ? (parseFloat(val)||0) : val;
}

function addNewProduct(){
  currentItems.push({name: "", name_roman: "", units: [{label: "KG", rate: 0}], available: true, featured: false, image: ""});
  renderProductsEditor();
}

function delProduct(idx){
  currentItems.splice(idx, 1);
  renderProductsEditor();
}

async function saveGitHubChanges(){
  try{
    showToast("⏳ محفوظ ہو رہا ہے...");
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(currentItems, null, 2))));
    const res = await ghReq(currentFile, {
      method: "PUT",
      body: JSON.stringify({message: "Update rates via admin panel", content, sha: currentSha, branch: "main"})
    });
    currentSha = res.content.sha;
    showToast("✅ تمام تبدیلیاں گিট ہب پر محفوظ ہو گئیں!");
  }catch(e){
    showToast("❌ محفوظ نہیں ہو سکیں");
  }
}

function switchTab(tab){
  if(tab === 'orders'){
    document.getElementById('secOrders').style.display = 'block';
    document.getElementById('secProducts').style.display = 'none';
    document.getElementById('tabOrdersBtn').className = 'tab active';
    document.getElementById('tabProductsBtn').className = 'tab';
    renderOrders();
  } else {
    document.getElementById('secOrders').style.display = 'none';
    document.getElementById('secProducts').style.display = 'block';
    document.getElementById('tabOrdersBtn').className = 'tab';
    document.getElementById('tabProductsBtn').className = 'tab active';
  }
}

function fakeOrder(){
  const orders = JSON.parse(localStorage.getItem("sj_admin_orders") || "[]");
  orders.unshift({
    code: "SJ-" + Math.floor(1000 + Math.random() * 9000),
    name: "محمد خان (ٹیسٹ)", phone: "03155166034", address: "مینگورہ", area: "شہر کے اندر",
    payMethod: "کیش آن ڈیلیوری", itemsSummary: "Tomato / ٹماٹر (1 KG) — Rs. 150", total: 150,
    timestamp: Date.now(), date: new Date().toLocaleTimeString(), status: 'pending'
  });
  localStorage.setItem("sj_admin_orders", JSON.stringify(orders));
  playSound();
  renderOrders();
  showToast("✅ فرضی آرڈر آگیا!");
}

function renderOrders(){
  const area = document.getElementById("ordersArea");
  let orders = JSON.parse(localStorage.getItem("sj_admin_orders") || "[]");
  
  const now = Date.now();
  orders = orders.filter(o => !o.timestamp || (now - o.timestamp < 24*60*60*1000));
  localStorage.setItem("sj_admin_orders", JSON.stringify(orders));

  if(orders.length === 0){
    area.innerHTML = `<div style="text-align:center; color:var(--muted); padding:30px;">کوئی آرڈر موجود نہیں</div>`;
    return;
  }

  area.innerHTML = orders.map((o, idx) => `
    <div class="order-card ${o.status==='completed'?'completed':'pending'}">
      <button class="btn-danger" style="position:absolute; top:12px; left:14px;" onclick="delOrder(${idx})">✕ حذف</button>
      <div style="font-weight:800; font-size:16px; margin-bottom:6px;">📌 ${o.code} — ${o.name}</div>
      <div style="font-size:13.5px; line-height:1.7;">
        📞 فون: ${o.phone}<br>
        📍 پتہ: ${o.address} (${o.area})<br>
        💳 ادائیگی: ${o.payMethod}<br>
        🛒 اشیاء: <div style="background:#fff; padding:8px; border-radius:8px; margin-top:4px;">${o.itemsSummary}</div>
        💰 کل رقم: <b>Rs. ${o.total}</b>
      </div>
      <div style="margin-top:12px; display:flex; gap:6px;">
        <button class="btn-success" style="flex:1;" onclick="markDelivered(${idx})">✅ ڈیلیورڈ (واٹس ایپ شکریہ)</button>
      </div>
    </div>
  `).join("");
}

function markDelivered(idx){
  let orders = JSON.parse(localStorage.getItem("sj_admin_orders") || "[]");
  orders[idx].status = 'completed';
  localStorage.setItem("sj_admin_orders", JSON.stringify(orders));
  renderOrders();
  
  const o = orders[idx];
  const msg = `السلام علیکم محترم ${o.name}! 🙏\nآپ کا آرڈر [${o.code}] پہنچا دیا گیا ہے۔ SJ Foods کو منتخب کرنے کا شکریہ! 🌿`;
  let phone = o.phone.replace(/[^0-9]/g, "");
  if(phone.startsWith("0")) phone = "92" + phone.slice(1);
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, "_blank");
}

function delOrder(idx){
  if(!confirm("حذف کریں؟")) return;
  let orders = JSON.parse(localStorage.getItem("sj_admin_orders") || "[]");
  orders.splice(idx, 1);
  localStorage.setItem("sj_admin_orders", JSON.stringify(orders));
  renderOrders();
}

function clearAllOrders(){
  if(!confirm("تمام ہسٹری صاف کریں؟")) return;
  localStorage.removeItem("sj_admin_orders");
  renderOrders();
}

(function init(){
  const raw = localStorage.getItem("sj_admin_cfg");
  if(raw) initAdmin();
})();
</script>
</body>
</html>
