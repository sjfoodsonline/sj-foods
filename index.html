<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SJ Foods — آن لائن آرڈر کریں</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --dark: #153A20;
    --mid: #2E7D32;
    --leaf: #E8F5E9;
    --accent: #FF6F00;
    --paper: #FFFDF8;
    --ink: #20241F;
    --muted: #8A8F86;
    --price: #B71C1C;
    --line: #E5E4DA;
    --app-w: 480px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, sans-serif;
    direction: rtl;
    padding-bottom: 80px;
  }

  /* Centered Mobile View for PC/Laptops */
  @media (min-width: 640px) {
    html { background: #EDEAE0; }
    body {
      max-width: var(--app-w);
      margin: 20px auto;
      min-height: 95vh;
      box-shadow: 0 0 50px rgba(0,0,0,0.15);
      border-radius: 20px;
      position: relative;
      overflow-x: hidden;
    }
  }

  /* Header */
  header {
    background: linear-gradient(160deg, var(--dark), var(--mid));
    color: #fff;
    padding: 16px;
    text-align: center;
    border-radius: 0 0 18px 18px;
  }
  header h1 { margin: 0; font-size: 22px; font-family: "Noto Nastaliq Urdu", serif; }
  header p { margin: 4px 0 0; font-size: 12px; opacity: 0.9; }

  .wrap { padding: 14px; }

  /* Category Tabs Bar */
  .category-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 14px;
    -webkit-overflow-scrolling: touch;
  }
  .category-tabs::-webkit-scrollbar { display: none; }
  .cat-btn {
    background: #fff;
    border: 1px solid var(--line);
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    color: var(--ink);
    white-space: nowrap;
    cursor: pointer;
    transition: 0.2s;
  }
  .cat-btn.active {
    background: var(--dark);
    color: #fff;
    border-color: var(--dark);
  }

  /* Product Card Grid */
  .products-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 360px) {
    .products-grid { grid-template-columns: 1fr; }
  }

  .product-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
  }

  /* Swipeable Image Slider */
  .slider-box {
    position: relative;
    width: 100%;
    height: 130px;
    overflow: hidden;
    border-radius: 10px;
    background: var(--leaf);
  }
  .slider-track {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    height: 100%;
  }
  .slider-track::-webkit-scrollbar { display: none; }
  .slider-track img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    flex: 0 0 100%;
    scroll-snap-align: start;
  }
  .single-img {
    width: 100%;
    height: 130px;
    object-fit: cover;
    border-radius: 10px;
    background: var(--leaf);
  }

  .badge-unavailable {
    position: absolute;
    top: 14px;
    right: 14px;
    background: rgba(183,28,28,0.85);
    color: #fff;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 6px;
    z-index: 2;
  }

  .p-title {
    font-size: 14px;
    font-weight: 700;
    margin: 8px 0 2px;
    color: var(--dark);
  }
  .p-roman {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 8px;
    direction: ltr;
    text-align: right;
  }

  .price-select {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px;
    font-size: 12px;
    background: #fff;
    margin-bottom: 8px;
  }

  .add-cart-btn {
    background: var(--dark);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px;
    font-size: 12.5px;
    font-weight: bold;
    width: 100%;
    cursor: pointer;
  }
  .add-cart-btn:disabled {
    background: var(--line);
    color: var(--muted);
    cursor: not-allowed;
  }

  .loading { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>

<header>
  <h1>🥬 SJ Foods</h1>
  <p>تازہ ترین سبزی اور پھل گھر منگوائیں</p>
</header>

<div class="wrap">
  <!-- Categories Row -->
  <div class="category-tabs" id="categoriesTabs"></div>

  <!-- Products List -->
  <div class="products-grid" id="productsArea">
    <div class="loading">⏳ پروڈکٹس لوڈ ہو رہے ہیں...</div>
  </div>
</div>

<script>
const CATEGORIES_INDEX_FILE = "categories_index.json";
let currentCategories = [];

// Base GitHub Path (Change repository details if needed)
const OWNER = "sjfoodsonline";
const REPO = "sj-foods";

async function fetchJson(file) {
  const res = await fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/main/${file}`);
  if(!res.ok) throw new Error("ڈیٹا لوڈ نہ ہو سکا");
  return res.json();
}

// Initial Load
async function initApp() {
  try {
    currentCategories = await fetchJson(CATEGORIES_INDEX_FILE);
    renderCategoriesTabs();
    if(currentCategories.length > 0) {
      loadCategoryProducts(currentCategories[0].file);
    }
  } catch (err) {
    document.getElementById("productsArea").innerHTML = `<div class="loading">❌ ڈیٹا لوڈ کرنے میں مسئلہ آیا ہے</div>`;
  }
}

// Render Category Tab Buttons
function renderCategoriesTabs() {
  const tabsContainer = document.getElementById("categoriesTabs");
  tabsContainer.innerHTML = currentCategories.map((c, idx) => `
    <button class="cat-btn ${idx === 0 ? 'active' : ''}" onclick="switchCategory('${c.file}', this)">
      ${c.icon || ''} ${c.category}
    </button>
  `).join("");
}

// Switch Category
async function switchCategory(file, btnEl) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btnEl.classList.add('active');
  await loadCategoryProducts(file);
}

// Fetch and Render Category Products
async function loadCategoryProducts(file) {
  const area = document.getElementById("productsArea");
  area.innerHTML = `<div class="loading">⏳ لوڈ ہو رہا ہے...</div>`;
  
  try {
    const products = await fetchJson(file);
    if (!products || products.length === 0) {
      area.innerHTML = `<div class="loading">اس کیٹگری میں کوئی پروڈکٹ نہیں ہے</div>`;
      return;
    }
    
    area.innerHTML = products.map(item => buildProductCard(item)).join("");
  } catch (e) {
    area.innerHTML = `<div class="loading">❌ پروڈکٹس لوڈ نہیں ہو سکے</div>`;
  }
}

// Build Product Card with Swipe Images Support
function buildProductCard(it) {
  // Extract images array
  let images = [];
  if (Array.isArray(it.images) && it.images.length > 0) {
    images = it.images;
  } else if (it.image) {
    images = [it.image];
  } else {
    images = ['https://via.placeholder.com/150'];
  }

  // Handle Multi Image vs Single Image View
  let imageMarkup = "";
  if (images.length > 1) {
    imageMarkup = `
      <div class="slider-box">
        <div class="slider-track">
          ${images.map(imgSrc => `<img src="${imgSrc}" alt="${it.name}">`).join('')}
        </div>
      </div>
    `;
  } else {
    imageMarkup = `<img src="${images[0]}" alt="${it.name}" class="single-img">`;
  }

  // Handle Units / Pricing Options
  const units = it.units && it.units.length > 0 ? it.units : [{label: "کلو", rate: 0}];
  const optionsMarkup = units.map(u => `<option value="${u.rate}">${u.label} - Rs.${u.rate}</option>`).join("");

  const isAvailable = it.available !== false;

  return `
    <div class="product-card">
      ${!isAvailable ? `<span class="badge-unavailable">غیر دستیاب</span>` : ''}
      
      ${imageMarkup}

      <div class="p-title">${it.name}</div>
      ${it.name_roman ? `<div class="p-roman">${it.name_roman}</div>` : ''}

      <select class="price-select" ${!isAvailable ? 'disabled' : ''}>
        ${optionsMarkup}
      </select>

      <button class="add-cart-btn" ${!isAvailable ? 'disabled' : ''}>
        ${isAvailable ? '🛒 شامل کریں' : 'نایاب'}
      </button>
    </div>
  `;
}

// Initialize on page load
initApp();
</script>
</body>
</html>
