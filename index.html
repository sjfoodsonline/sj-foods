<!DOCTYPE html>
<html lang="ur" dir="rtl" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>SJ FOODS — Fresh Vegetables, Fruits, Groceries & Daily Essentials</title>
<!-- [باقی تمام CSS سٹائل پہلے والے ہی رہیں گے تاکہ ڈیزائن نہ بگڑے] -->
<!-- (نوٹ: میں نے یہاں پر صرف اہم سیکشنز دیے ہیں، باقی سٹائل آپ کا پرانا ہی رہے گا) -->
</head>
<body translate="no">

<header>
  <div class="header-title-box">
    <h1>SJ FOODS</h1>
    <p>🥦 Fresh Produce, Groceries & Daily Essentials 🚚</p>
  </div>
  <!-- بٹنز وہی پرانے -->
</header>

<!-- (درمیان والا سارا سٹرکچر اور ماڈل وہی پرانے رہیں گے) -->

<!-- بینک اکاؤنٹ کاپی کرنے کا سیکشن (اپ ڈیٹڈ) -->
<div class="pay-card" id="payCard">
  <div class="pay-card-title">📲 ایزی پیسہ یا بینک ٹرانسفر (ترجیحی ادائیگی)</div>
  <div class="pay-amount" id="payAmount">Rs. 0</div>
  
  <div style="font-size:12.5px; font-weight:bold; margin-bottom:3px;">EasyPaisa / JazzCash:</div>
  <div class="pay-number-row" style="margin-bottom:8px;">
    <span class="pay-number" id="payNumber">0334-9353799</span>
    <button id="copyNumBtn">📋 کاپی</button>
  </div>
  
  <div style="border-top:1px dashed rgba(255,255,255,0.3); padding-top:8px; margin-top:8px;">
    <div style="font-size:12.5px; font-weight:bold; margin-bottom:3px;">Bank of Khyber (IBAN):</div>
    <div class="pay-number-row" style="margin-bottom:8px;">
      <span class="pay-number" id="payNumberIban" style="font-size:12px;">PK53KHYB5012003008539951</span>
      <button id="copyIbanBtn">📋 کاپی</button>
    </div>
    <div style="font-size:11.5px; opacity:0.9;">اکاؤنٹ نام: سلیمان جان</div>
  </div>
</div>

<script>
// بینک اکاؤنٹ کاپی کرنے کا فنکشن
document.getElementById("copyIbanBtn").onclick = async ()=>{
  try{
    await navigator.clipboard.writeText("PK53KHYB5012003008539951");
    showToast("✅ IBAN نمبر کاپی ہوگیا");
  }catch(e){ showToast("IBAN: PK53KHYB5012003008539951"); }
};
// [باقی تمام لاجک وہی رہے گی، صرف نام کی جگہ SJ FOODS کر دیں]
</script>
</body>
</html>
