<!DOCTYPE html>
<html lang="ur" dir="rtl" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SJ Online — Vendor Control Panel</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --dark:#153A20; --mid:#2E7D32; --leaf:#E8F5E9; --accent:#FF6F00;
    --paper:#FFFDF8; --ink:#20241F; --muted:#8A8F86; --price:#B71C1C; --line:#E5E4DA;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:Arial, sans-serif; direction:rtl; padding-bottom:110px; font-weight:bold;}
  header{background:linear-gradient(160deg,var(--dark),var(--mid)); color:#fff; padding:16px; border-radius:0 0 18px 18px;}
  header h1{margin:0; font-size:18px;}
  header p{margin:4px 0 0; font-size:11.5px; opacity:.9;}

  .wrap{padding:14px; max-width:720px; margin:0 auto; width:100%;}
  .card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px;}
  .card h3{margin:0 0 10px; font-size:14px; color:var(--dark);}
  
  input[type=text], input[type=password], input[type=number], select, textarea{
    width:100%; border:1px solid var(--line); border-radius:9px; padding:9px 10px;
    font-size:13px; font-family:Arial, sans-serif; font-weight:bold; direction:rtl; margin-bottom:8px; background:#fff; color:var(--ink);
  }
  label{font-size:11.5px; color:var(--muted); display:block; margin-bottom:3px;}
  button{font-family:Arial, sans-serif; font-weight:bold; cursor:pointer; border:none;}
  .btn-primary{background:var(--dark); color:#fff; border-radius:10px; padding:11px 16px; font-size:13.5px; width:100%;}
  .btn-secondary{background:var(--leaf); color:var(--dark); border-radius:9px; padding:8px 12px; font-size:12.5px;}
  .btn-danger{background:#FDECEA; color:#B71C1C; border-radius:9px; padding:8px 10px; font-size:12px;}

  .tabs{display:flex; gap:6px; margin-bottom:14px;}
  .tab{flex:1; padding:10px 4px; text-align:center; background:#fff; border:1px solid var(--line); border-radius:10px; font-size:11px; color:var(--muted); cursor:pointer;}
  .tab.active{background:var(--dark); color:#fff; border-color:var(--dark);}

  .product-row{background:#fff; border:1px solid var(--line); border-radius:14px; padding:10px; margin-bottom:10px; display:flex; flex-direction:column; gap:8px;}
  .row-top{display:flex; align-items:center; gap:8px;}
  .thumb-box{flex:0 0 56px; width:56px; height:56px; border-radius:10px; background:var(--leaf); display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .row-fields{flex:1; display:flex; flex-direction:column; gap:6px;}

  .units-box{background:var(--paper); border-radius:10px; padding:8px; margin-top:2px;}
  .unit-row{display:flex; gap:6px; margin-bottom:6px; align-items:center; flex-wrap:wrap;}
  .unit-row input.u-label{flex:1 1 120px;}
  .unit-row input.u-rate{flex:0 0 110px; direction:ltr; text-align:left;}

  .preset-pills{display:flex; gap:5px; flex-wrap:wrap; margin-top:6px; margin-bottom:6px;}
  .preset-pill{background:var(--leaf); color:var(--dark); border:1px solid #c8e6c9; border-radius:8px; padding:4px 8px; font-size:11px; cursor:pointer;}
  .preset-pill:hover{background:var(--dark); color:#fff;}
  
  .savebar{
    position:fixed; bottom:0; right:0; left:0; background:#fff; border-top:1.5px solid var(--line);
    padding:10px 12px; display:flex; gap:10px; align-items:center; z-index:90; max-width:800px; margin:0 auto;
  }
  .toast{position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--dark); color:#fff; padding:10px 18px; border-radius:30px; font-size:12.5px; opacity:0; pointer-events:none; transition:opacity .25s; z-index:200;}
  .toast.show{opacity:1;}
  .toast.err{background:#B71C1C;}
  .loading{text-align:center; color:var(--muted); font-size:12.5px; padding:20px;}
</style>
</head>
<body>

<header>
  <h1>🏪 Vendor Control Panel</h1>
  <p>Manage your products, rates & live orders</p>
</header>

<div class="wrap">
  <!-- LOGIN SECTION -->
  <div id="loginCard" class="card">
    <h3>🔐 Vendor Login</h3>
    <label>Enter your Shop ID or Phone Number</label>
    <input type="text" id="vendorInputId" placeholder="e.g. v002 or 03000000000">
    <button class="btn-primary" onclick="loginVendor()">Login to Panel</button>
    <div style="margin-top:10px; text-align:center;">
      <a href="vendor-register.html" style="color:var(--mid); font-size:13px;">Don't have a shop? Register here</a>
    </div>
  </div>

  <!-- DASHBOARD SECTION -->
  <div id="dashboardSec" style="display:none;">
    <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
      <div>
        <h3 id="shopTitleDisplay" style="margin:0;">Shop Name</h3>
        <p id="shopStatusDisplay" style="margin:2px 0 0; font-size:11px; color:var(--mid);">Status: Approved</p>
      </div>
      <button class="btn-danger" style="padding:6px 10px;" onclick="logoutVendor()">Logout</button>
    </div>

    <div class="tabs">
      <div class="tab active" id="tabOrders" onclick="switchVendorTab('orders')">📥 Live Orders</div>
      <div class="tab" id="tabCatalog" onclick="switchVendorTab('catalog')">🏷️ Products & Rates</div>
    </div>

    <!-- TAB 1: ORDERS -->
    <div id="secVendorOrders">
      <div id="vendorOrdersArea"><div class="loading">⏳ Loading orders...</div></div>
    </div>

    <!-- TAB 2: CATALOG -->
    <div id="secVendorCatalog" style="display:none;">
      <div class="card">
        <label>Select Category</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="newCatName" placeholder="New Category Name (e.g. سبزی, Beverages)">
          <button class="btn-secondary" style="background:var(--dark); color:#fff;" onclick="addNewCategory()">➕ Add</button>
        </div>
        <select id="vendorCategoryPicker" onchange="loadVendorCategory(this.value)" style="margin-top:8px;"></select>
      </div>

      <div id="vendorProductsArea"><div class="loading">⏳ Loading products...</div></div>
      <button class="btn-secondary" style="width:100%; background:var(--dark); color:#fff; padding:12px; margin-top:10px;" onclick="addVendorProduct()">➕ Add New Product</button>
    </div>
  </div>
</div>

<div class="savebar" id="saveBar" style="display:none;">
  <div class="status" id="saveStatus" style="flex:1; font-size:12px; color:var(--price);">⚠️ Unsaved changes</div>
  <button class="btn-primary" style="width:auto; min-width:110px;" onclick="saveVendorCatalog()">💾 Save Changes</button>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue, update, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = { databaseURL: "https://sj-foods-default-rtdb.firebaseio.com" };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  window.dbInstance = db;
  window.dbRef = ref;
  window.dbUpdate = update;
  window.dbSet = set;

  function showToast(msg, isErr){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "toast show" + (isErr ? " err" : "");
    setTimeout(()=> t.className = "toast", 2600);
  }
  window.showToast = showToast;

  let currentVendorId = localStorage.getItem("sj_vendor_id") || "";
  let currentCatalog = {};
  let activeCategory = "";
  let catalogDirty = false;

  window.markDirty = function(){
    catalogDirty = true;
    document.getElementById("saveBar").style.display = "flex";
  }

  window.loginVendor = async function(){
    let id = document.getElementById("vendorInputId").value.trim();
    if(!id){ alert("Please enter your Shop ID or Phone"); return; }
    showToast("Checking...");
    try{
      const res = await fetch("https://sj-foods-default-rtdb.firebaseio.com/vendors/" + id + ".json");
      const v = await res.json();
      if(!v){ alert("Shop not found!"); return; }
      if(v.blocked){ alert("Your shop has been blocked by admin."); return; }
      
      currentVendorId = id;
      localStorage.setItem("sj_vendor_id", id);
      initVendorDashboard(v);
    }catch(e){ alert("Login failed"); }
  }

  window.logoutVendor = function(){
    localStorage.removeItem("sj_vendor_id");
    location.reload();
  }

  if(currentVendorId){
    fetch("https://sj-foods-default-rtdb.firebaseio.com/vendors/" + currentVendorId + ".json")
      .then(r => r.json())
      .then(v => {
        if(v && !v.blocked) initVendorDashboard(v);
        else logoutVendor();
      }).catch(() => {});
  }

  function initVendorDashboard(v){
    document.getElementById("loginCard").style.display = "none";
    document.getElementById("dashboardSec").style.display = "block";
    document.getElementById("shopTitleDisplay").textContent = v.shop_name || currentVendorId;
    document.getElementById("shopStatusDisplay").textContent = "Status: " + (v.status || "approved");
    
    currentCatalog = v.items || {};
    initVendorCategories();
    watchVendorOrders();
  }

  window.switchVendorTab = function(tab){
    document.getElementById("tabOrders").className = "tab" + (tab==='orders'?' active':'');
    document.getElementById("tabCatalog").className = "tab" + (tab==='catalog'?' active':'');
    document.getElementById("secVendorOrders").style.display = (tab==='orders'?'block':'none');
    document.getElementById("secVendorCatalog").style.display = (tab==='catalog'?'block':'none');
    document.getElementById("saveBar").style.display = (tab==='catalog' && catalogDirty)?'flex':'none';
  }

  function initVendorCategories(){
    const picker = document.getElementById("vendorCategoryPicker");
    const cats = Object.keys(currentCatalog);
    if(cats.length === 0){
      currentCatalog = { "سبزی": {} };
      cats.push("سبزی");
    }
    picker.innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join("");
    activeCategory = cats[0];
    renderVendorProducts();
  }

  window.addNewCategory = function(){
    let name = document.getElementById("newCatName").value.trim();
    if(!name) return;
    if(currentCatalog[name]){ alert("Category already exists"); return; }
    currentCatalog[name] = {};
    document.getElementById("newCatName").value = "";
    initVendorCategories();
    document.getElementById("vendorCategoryPicker").value = name;
    loadVendorCategory(name);
    markDirty();
  }

  window.loadVendorCategory = function(cat){
    activeCategory = cat;
    renderVendorProducts();
  }

  function renderVendorProducts(){
    const area = document.getElementById("vendorProductsArea");
    const itemsObj = currentCatalog[activeCategory] || {};
    const keys = Object.keys(itemsObj);

    if(keys.length === 0){
      area.innerHTML = `<div class="loading">No products in this category. Click 'Add New Product'.</div>`;
      return;
    }

    const presets = ["KG", "آدھا کلو", "پاؤ", "دڑی (5 KG)", "Litre", "Bottle", "Pcs", "Dozen", "Weight", "Service", "Meter", "Carat", "Gold"];

    area.innerHTML = keys.map(k => {
      let it = itemsObj[k];
      if(!it.units) it.units = [{label: it.unit||"KG", rate: it.rate||0}];
      return `
        <div class="product-row">
          <div class="row-top">
            <div class="thumb-box">${it.image ? `<img src="${it.image}" style="width:100%;height:100%;object-fit:cover;">` : '🛒'}</div>
            <div class="row-fields">
              <input type="text" value="${it.name||''}" placeholder="Product Name (Urdu)" oninput="updateItemField('${k}','name',this.value)">
              <input type="text" value="${it.name_roman||''}" placeholder="Roman Name" dir="ltr" style="text-align:left;" oninput="updateItemField('${k}','name_roman',this.value)">
            </div>
          </div>
          <div class="units-box">
            ${it.units.map((u, ui) => `
              <div class="unit-row">
                <input type="text" class="u-label" value="${u.label}" placeholder="Unit" oninput="updateUnitField('${k}',${ui},'label',this.value)">
                <input type="number" class="u-rate" value="${u.rate}" placeholder="Rate" oninput="updateUnitRate('${k}',${ui},this.value)">
                ${it.units.length > 1 ? `<button class="btn-danger" style="padding:4px 8px;" onclick="removeUnit('${k}',${ui})">✕</button>` : ''}
              </div>
            `).join('')}
          </div>
          <div class="preset-pills">
            ${presets.map(p => `<button type="button" class="preset-pill" onclick="addPresetUnit('${k}','${p}')">+ ${p}</button>`).join('')}
          </div>
          <div style="display:flex; gap:6px;">
            <button class="btn-secondary" style="font-size:11px; padding:4px 8px;" onclick="addCustomUnit('${k}')">➕ Add Unit</button>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
            <label><input type="checkbox" ${it.available!==false?'checked':''} onchange="updateItemField('${k}','available',this.checked)"> Available</label>
            <button class="btn-danger" onclick="deleteVendorItem('${k}')">🗑️ Delete</button>
          </div>
        </div>
      `;
    }).join("");
  }

  window.updateItemField = function(k, field, val){
    currentCatalog[activeCategory][k][field] = val;
    markDirty();
  }

  window.updateUnitField = function(k, ui, field, val){
    currentCatalog[activeCategory][k].units[ui][field] = val;
    markDirty();
  }

  window.updateUnitRate = function(k, ui, val){
    val = parseFloat(val) || 0;
    let it = currentCatalog[activeCategory][k];
    it.units[ui].rate = val;
    if(ui === 0 && it.units.length > 1){
      it.units.forEach((u, i) => {
        if(i === 0) return;
        let lbl = u.label.toLowerCase();
        if(lbl.includes("پاؤ") || lbl.includes("250")) u.rate = Math.round(val / 4);
        else if(lbl.includes("آدھا") || lbl.includes("500") || lbl.includes("half")) u.rate = Math.round(val / 2);
        else if(lbl.includes("دڑی") || lbl.includes("5kg") || lbl.includes("5 کلو")) u.rate = Math.round(val * 5);
      });
      renderVendorProducts();
    }
    markDirty();
  }

  window.addPresetUnit = function(k, label){
    let it = currentCatalog[activeCategory][k];
    it.units.push({label: label, rate: 0});
    renderVendorProducts();
    markDirty();
  }

  window.addCustomUnit = function(k){
    let it = currentCatalog[activeCategory][k];
    it.units.push({label: "", rate: 0});
    renderVendorProducts();
    markDirty();
  }

  window.removeUnit = function(k, ui){
    currentCatalog[activeCategory][k].units.splice(ui, 1);
    renderVendorProducts();
    markDirty();
  }

  window.addVendorProduct = function(){
    let id = "item_" + Date.now();
    if(!currentCatalog[activeCategory]) currentCatalog[activeCategory] = {};
    currentCatalog[activeCategory][id] = { name: "", units: [{label: "KG", rate: 0}], available: true };
    renderVendorProducts();
    markDirty();
  }

  window.deleteVendorItem = function(k){
    if(!confirm("Delete item?")) return;
    delete currentCatalog[activeCategory][k];
    renderVendorProducts();
    markDirty();
  }

  window.saveVendorCatalog = async function(){
    showToast("Saving...");
    try{
      await fetch("https://sj-foods-default-rtdb.firebaseio.com/vendors/" + currentVendorId + "/items.json", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(currentCatalog)
      });
      catalogDirty = false;
      document.getElementById("saveBar").style.display = "none";
      showToast("✅ Saved Successfully!");
    }catch(e){
      showToast("❌ Save failed", true);
    }
  }

  function watchVendorOrders(){
    const ordersRef = ref(db, 'orders');
    onValue(ordersRef, (snapshot) => {
      const data = snapshot.val() || {};
      let list = Object.values(data).filter(o => o.vendor_id === currentVendorId);
      const area = document.getElementById("vendorOrdersArea");
      
      if(list.length === 0){
        area.innerHTML = `<div class="loading">No orders for your shop yet.</div>`;
        return;
      }

      area.innerHTML = list.map(o => {
        let isDone = (o.status === 'completed' || o.status === 'delivered');
        let isCan = (o.status === 'cancelled');
        return `
          <div class="card" style="border:2px solid ${isCan?'#B71C1C':(isDone?'#81C784':'var(--line))'};">
            <div><b>Order:</b> ${o.code} | <b>Status:</b> ${o.status || 'Pending'}</div>
            <div><b>Customer:</b> ${o.name} (${o.phone})</div>
            <div><b>Address:</b> ${o.address}</div>
            <div style="background:#F9F8F3; padding:8px; border-radius:6px; margin:6px 0;">${o.items}</div>
            <div><b>Total:</b> Rs. ${o.total}</div>
            ${!isDone && !isCan ? `
              <div style="display:flex; gap:6px; margin-top:10px;">
                <button class="btn-secondary" style="background:#C8E6C9;" onclick="vendorComplete('${o.code}')">✅ Mark Delivered</button>
                <button class="btn-danger" onclick="vendorCancel('${o.code}')">❌ Cancel Order</button>
              </div>
            ` : ''}
          </div>
        `;
      }).join("");
    });
  }

  window.vendorComplete = async function(code){
    if(!confirm("Mark delivered?")) return;
    await update(ref(db, 'orders/' + code), { status: "completed" });
    showToast("Completed ✓");
  }

  window.vendorCancel = async function(code){
    let reason = prompt("Enter cancellation reason:");
    if(!reason) return;
    await update(ref(db, 'orders/' + code), {
      status: "cancelled",
      cancelled_by: "Vendor",
      cancel_reason: reason
    });
    showToast("Cancelled ✕");
  }
</script>
</body>
</html>
