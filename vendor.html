<!DOCTYPE html>
<html lang="ur" dir="rtl" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SJ Online — Vendor Panel</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{ --dark:#153A20; --mid:#2E7D32; --leaf:#E8F5E9; --accent:#FF6F00; --paper:#FFFDF8; --ink:#20241F; --muted:#8A8F86; --price:#B71C1C; --line:#E5E4DA; }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:Arial,sans-serif; direction:rtl; padding-bottom:110px; font-weight:bold;}
  header{background:linear-gradient(160deg,var(--dark),var(--mid)); color:#fff; padding:16px; border-radius:0 0 18px 18px;}
  header h1{margin:0; font-size:17px;}
  header p{margin:4px 0 0; font-size:11.5px; opacity:.9;}
  .wrap{padding:14px; max-width:720px; margin:0 auto; width:100%;}
  .card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px;}
  .card h3{margin:0 0 10px; font-size:14px; color:var(--dark);}
  input[type=text], input[type=password], input[type=number], select, textarea{
    width:100%; border:1px solid var(--line); border-radius:9px; padding:10px; font-size:13px; font-weight:bold;
    direction:rtl; margin-bottom:8px; background:#fff; color:var(--ink); font-family:Arial,sans-serif;
  }
  label{font-size:11.5px; color:var(--muted); display:block; margin-bottom:4px;}
  button{font-family:Arial,sans-serif; font-weight:bold; cursor:pointer; border:none;}
  .btn-primary{background:var(--dark); color:#fff; border-radius:10px; padding:12px 16px; font-size:14px; width:100%;}
  .btn-secondary{background:var(--leaf); color:var(--dark); border-radius:9px; padding:8px 12px; font-size:12.5px;}
  .btn-danger{background:#FDECEA; color:#B71C1C; border-radius:9px; padding:8px 10px; font-size:12px;}
  .tabs{display:flex; gap:6px; margin-bottom:14px;}
  .tab{flex:1; padding:10px 4px; text-align:center; background:#fff; border:1px solid var(--line); border-radius:10px; font-size:11px; color:var(--muted); cursor:pointer;}
  .tab.active{background:var(--dark); color:#fff; border-color:var(--dark);}
  .chat-item{background:#fff; border:2px solid var(--line); border-radius:14px; margin-bottom:10px; overflow:hidden;}
  .chat-item.pending{animation: blink 1.2s infinite; background:#FFFDE7;}
  .chat-item.completed{background:#F1F8E9; border-color:#81C784;}
  .chat-item.cancelled{background:#FFEBEE; border-color:#D32F2F; opacity:.85;}
  @keyframes blink{0%{border-color:#D32F2F;}50%{border-color:#FF8A80;}100%{border-color:#D32F2F;}}
  .chat-header{padding:12px; cursor:pointer; display:flex; justify-content:space-between; gap:8px; font-size:13px;}
  .chat-body{display:none; padding:0 12px 12px; border-top:1px dashed var(--line);}
  .chat-item.open .chat-body{display:block;}
  .product-row{background:#fff; border:1px solid var(--line); border-radius:14px; padding:10px; margin-bottom:10px;}
  .row-top{display:flex; gap:8px; align-items:center;}
  .thumb-box{flex:0 0 56px; width:56px; height:56px; border-radius:10px; background:var(--leaf); position:relative; overflow:hidden; border:1px dashed var(--mid); display:flex; align-items:center; justify-content:center;}
  .row-fields{flex:1;}
  .units-box{background:var(--paper); border-radius:10px; padding:8px; margin-top:8px;}
  .unit-row{display:flex; gap:6px; margin-bottom:6px; flex-wrap:wrap; align-items:center;}
  .unit-row input.u-label{flex:1 1 110px; margin-bottom:0;}
  .unit-row input.u-rate{flex:0 0 100px; margin-bottom:0; direction:ltr; text-align:left;}
  .preset-pills{display:flex; gap:5px; flex-wrap:wrap; margin-top:6px;}
  .preset-pill{background:var(--leaf); color:var(--dark); border:1px solid #c8e6c9; border-radius:8px; padding:4px 8px; font-size:11px; cursor:pointer;}
  .savebar{position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1.5px solid var(--line); padding:10px 12px; display:none; gap:10px; align-items:center; max-width:720px; margin:0 auto; z-index:90;}
  .toast{position:fixed; top:14px; left:50%; transform:translateX(-50%); background:var(--dark); color:#fff; padding:10px 16px; border-radius:30px; font-size:12.5px; opacity:0; transition:opacity .25s; z-index:200; pointer-events:none;}
  .toast.show{opacity:1;} .toast.err{background:#B71C1C;}
  .hint{font-size:11px; color:var(--muted); line-height:1.5; margin:8px 0 0;}
  .loading{text-align:center; color:var(--muted); padding:20px; font-size:13px;}
  .img-url{direction:ltr; text-align:left; font-size:12px;}
</style>
</head>
<body>
<header>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
    <div>
      <h1>🏪 Vendor Panel</h1>
      <p>Orders · Products · Rates — same style as Admin</p>
    </div>
    <a href="index.html" style="color:#fff;font-size:12px;text-decoration:none;background:rgba(255,255,255,.2);padding:6px 10px;border-radius:8px;">← Home</a>
  </div>
</header>
<div class="wrap">
  <div id="loginCard" class="card">
    <h3>🔐 Vendor Login</h3>
    <label>Shop ID یا فون نمبر</label>
    <input type="text" id="vendorInputId" placeholder="v19146945 یا 03XXXXXXXXX" dir="ltr" style="text-align:left" autocomplete="username">
    <label>Login PIN (4–6 digits)</label>
    <input type="password" id="vendorPin" placeholder="آپ کا PIN" dir="ltr" style="text-align:left" maxlength="8" inputmode="numeric" autocomplete="current-password">
    <button type="button" class="btn-primary" id="loginBtn">Login to Panel</button>
    <p class="hint">رجسٹریشن کے وقت والا PIN ضروری ہے۔ ID مثال: <b dir="ltr">v19146945</b></p>
    <div style="text-align:center;margin-top:10px;">
      <a href="vendor-register.html" style="color:var(--mid);font-size:13px;">نیا اکاؤنٹ؟ Register</a>
    </div>
  </div>

  <div id="dashboardSec" style="display:none;">
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
      <div>
        <h3 id="shopTitleDisplay" style="margin:0;">Shop</h3>
        <p id="shopStatusDisplay" style="margin:4px 0 0;font-size:11px;color:var(--mid);"></p>
        <p id="shopIdDisplay" style="margin:2px 0 0;font-size:11px;color:var(--muted);direction:ltr;text-align:right;"></p>
      </div>
      <button type="button" class="btn-danger" onclick="logoutVendor()">Logout</button>
    </div>
    <div class="tabs">
      <div class="tab active" id="tabOrders" onclick="switchVendorTab('orders')">📥 Orders</div>
      <div class="tab" id="tabCatalog" onclick="switchVendorTab('catalog')">🏷️ Products & Rates</div>
    </div>
    <div id="secVendorOrders">
      <div id="vendorOrdersArea" class="loading">⏳ Loading orders…</div>
    </div>
    <div id="secVendorCatalog" style="display:none;">
      <div class="card">
        <label>Category</label>
        <div style="display:flex;gap:8px;">
          <input type="text" id="newCatName" placeholder="نئی کیٹگری نام" style="margin-bottom:0;">
          <button type="button" class="btn-secondary" style="background:var(--dark);color:#fff;white-space:nowrap;" onclick="addNewCategory()">➕ Add</button>
        </div>
        <select id="vendorCategoryPicker" onchange="loadVendorCategory(this.value)" style="margin-top:8px;"></select>
      </div>
      <div id="vendorProductsArea" class="loading">کیٹگری چنیں</div>
      <button type="button" class="btn-secondary" style="width:100%;background:var(--dark);color:#fff;padding:12px;margin-top:10px;" onclick="addVendorProduct()">➕ Add Product</button>
    </div>
  </div>
</div>
<div class="savebar" id="saveBar">
  <div id="saveStatus" style="flex:1;font-size:12px;color:var(--price);">Unsaved</div>
  <button type="button" class="btn-primary" style="width:auto;min-width:120px;" onclick="saveVendorCatalog()">💾 Save</button>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
const app = initializeApp({ databaseURL: "https://sj-foods-default-rtdb.firebaseio.com" });
const db = getDatabase(app);
window.dbInstance = db;
window.dbRef = ref;
window.dbUpdate = update;
</script>
<script>
const RTDB = "https://sj-foods-default-rtdb.firebaseio.com";

/** Firebase items: flat {id:{category,name,...}} یا nested {cat:{id:{...}}} */
function normalizeCatalog(raw){
  const out = {};
  if(!raw || typeof raw !== "object") return out;
  const keys = Object.keys(raw);
  if(!keys.length) return out;
  // detect nested: first value is object of products (has name/units) vs product itself
  let nested = 0, flat = 0;
  keys.forEach(function(k){
    const v = raw[k];
    if(!v || typeof v !== "object") return;
    if(v.name || v.name_roman || v.units || v.rate != null || v.image) flat++;
    else {
      const sub = Object.keys(v);
      if(sub.length && v[sub[0]] && typeof v[sub[0]] === "object") nested++;
    }
  });
  if(flat >= nested){
    keys.forEach(function(id){
      const it = raw[id];
      if(!it || typeof it !== "object") return;
      if(!(it.name || it.units || it.rate != null)) return;
      let cat = it.category || it.cat || "General";
      if(!out[cat]) out[cat] = {};
      const copy = Object.assign({}, it);
      if(!copy.units){
        copy.units = [{ label: copy.unit || "Pcs", rate: copy.rate || 0 }];
      }
      if(!copy.images) copy.images = copy.image ? [copy.image] : [];
      out[cat][id] = copy;
    });
  } else {
    keys.forEach(function(cat){
      const group = raw[cat];
      if(!group || typeof group !== "object") return;
      out[cat] = {};
      Object.keys(group).forEach(function(id){
        const it = group[id];
        if(!it || typeof it !== "object") return;
        const copy = Object.assign({}, it);
        if(!copy.units) copy.units = [{ label: copy.unit || "Pcs", rate: copy.rate || 0 }];
        if(!copy.images) copy.images = copy.image ? [copy.image] : [];
        out[cat][id] = copy;
      });
    });
  }
  return out;
}
function denormalizeCatalogFlat(catalog){
  // save flat with category field (compatible with old data + home)
  const flat = {};
  Object.keys(catalog || {}).forEach(function(cat){
    const group = catalog[cat] || {};
    Object.keys(group).forEach(function(id){
      const it = Object.assign({}, group[id]);
      it.category = cat;
      if(it.units && it.units[0]){
        it.rate = it.units[0].rate;
        it.unit = it.units[0].label;
      }
      if(it.images && it.images[0]) it.image = it.images[0];
      flat[id] = it;
    });
  });
  return flat;
}


let currentVendorId = "";
let currentVendor = null;
let currentCatalog = {};
let activeCategory = "";
let catalogDirty = false;
let ordersUnsub = null;
let activeOrderId = null;

function showToast(msg, isErr){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (isErr ? " err" : "");
  setTimeout(function(){ t.className = "toast"; }, 2800);
}
window.showToast = showToast;

function normalizePhoneDigits(p){
  let d = String(p||"").replace(/[^0-9]/g,"");
  if(d.indexOf("0092") === 0) d = "0" + d.slice(4);
  else if(d.indexOf("92") === 0 && d.length >= 12) d = "0" + d.slice(2);
  return d;
}

async function findVendor(idOrPhone){
  idOrPhone = String(idOrPhone||"").trim();
  if(!idOrPhone) return null;
  // Direct key
  try{
    const res = await fetch(RTDB + "/vendors/" + encodeURIComponent(idOrPhone) + ".json");
    const v = await res.json();
    if(v && typeof v === "object") return { id: idOrPhone, data: v };
  }catch(e){}
  // Search all by phone / id
  const allRes = await fetch(RTDB + "/vendors.json");
  const all = await allRes.json() || {};
  const want = normalizePhoneDigits(idOrPhone);
  for(const key of Object.keys(all)){
    if(key === "_market") continue;
    const row = all[key];
    if(!row || typeof row !== "object") continue;
    if(key === idOrPhone) return { id: key, data: row };
    const phones = [row.phone, row.whatsapp].map(normalizePhoneDigits);
    if(want && phones.indexOf(want) >= 0) return { id: key, data: row };
  }
  return null;
}

window.loginVendor = async function(){
  const idOrPhone = document.getElementById("vendorInputId").value.trim();
  const pin = document.getElementById("vendorPin").value.trim();
  if(!idOrPhone){ alert("Shop ID یا فون لکھیں"); return; }
  if(pin.length < 4){ alert("PIN کم از کم 4 ہندسے"); return; }
  const btn = document.getElementById("loginBtn");
  if(btn){ btn.disabled = true; btn.textContent = "Checking…"; }
  try{
    const found = await findVendor(idOrPhone);
    if(!found){ alert("Shop نہیں ملی — ID/فون چیک کریں"); return; }
    const v = found.data;
    if(v.blocked === true || v.status === "blocked"){ alert("شاپ بلاک ہے — ایڈمن سے رابطہ کریں"); return; }
    if(!v.pin){
      alert("اس اکاؤنٹ پر PIN سیٹ نہیں۔\nایڈمن Firebase میں pin فیلڈ لگائیں یا دوبارہ رجسٹر کریں۔");
      return;
    }
    if(String(v.pin).trim() !== pin){ alert("❌ غلط PIN"); return; }
    currentVendorId = found.id;
    currentVendor = v;
    try{
      localStorage.setItem("sj_vendor_id", currentVendorId);
      localStorage.setItem("sj_vendor_auth", "1");
    }catch(e){}
    initVendorDashboard(v);
    showToast("🟢 Login OK");
  }catch(e){
    alert("Login failed: " + (e.message || e));
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = "Login to Panel"; }
  }
};

window.logoutVendor = function(){
  try{
    localStorage.removeItem("sj_vendor_id");
    localStorage.removeItem("sj_vendor_auth");
  }catch(e){}
  location.reload();
};

document.getElementById("loginBtn").onclick = function(){ loginVendor(); };
document.getElementById("vendorPin").addEventListener("keydown", function(e){
  if(e.key === "Enter") loginVendor();
});

function initVendorDashboard(v){
  document.getElementById("loginCard").style.display = "none";
  document.getElementById("dashboardSec").style.display = "block";
  document.getElementById("shopTitleDisplay").textContent = v.shop_name || currentVendorId;
  document.getElementById("shopStatusDisplay").textContent = "Status: " + (v.status || "approved");
  document.getElementById("shopIdDisplay").textContent = "ID: " + currentVendorId;
  currentCatalog = normalizeCatalog(v.items || {});
  initVendorCategories();
  watchVendorOrders();
}

window.switchVendorTab = function(tab){
  document.getElementById("tabOrders").className = "tab" + (tab === "orders" ? " active" : "");
  document.getElementById("tabCatalog").className = "tab" + (tab === "catalog" ? " active" : "");
  document.getElementById("secVendorOrders").style.display = tab === "orders" ? "block" : "none";
  document.getElementById("secVendorCatalog").style.display = tab === "catalog" ? "block" : "none";
  document.getElementById("saveBar").style.display = (tab === "catalog" && catalogDirty) ? "flex" : "none";
};

function initVendorCategories(){
  const picker = document.getElementById("vendorCategoryPicker");
  const cats = Object.keys(currentCatalog);
  if(!cats.length){
    picker.innerHTML = '<option value="">— کوئی کیٹگری نہیں —</option>';
    document.getElementById("vendorProductsArea").innerHTML = '<div class="loading">اوپر نئی کیٹگری بنائیں</div>';
    return;
  }
  picker.innerHTML = cats.map(function(c){ return '<option value="'+c+'">'+c+'</option>'; }).join("");
  loadVendorCategory(cats[0]);
}

window.addNewCategory = function(){
  const name = document.getElementById("newCatName").value.trim();
  if(!name){ alert("کیٹگری نام لکھیں"); return; }
  if(!currentCatalog[name]) currentCatalog[name] = {};
  document.getElementById("newCatName").value = "";
  catalogDirty = true;
  document.getElementById("saveBar").style.display = "flex";
  initVendorCategories();
  document.getElementById("vendorCategoryPicker").value = name;
  loadVendorCategory(name);
  showToast("Category added — Save");
};

window.loadVendorCategory = function(cat){
  activeCategory = cat;
  renderVendorProducts();
};

function unitFactor(label){
  const lbl = String(label||"").toLowerCase();
  if(/پاؤ|250|paw/.test(lbl)) return 0.25;
  if(/آدھا|half|500|½/.test(lbl)) return 0.5;
  if(/دڑی|5\s*kg|5kg|5\s*کلو/.test(lbl)) return 5;
  if(/درجن|dozen/.test(lbl)) return 12;
  if(/kg|کلو|ltr|liter|لیٹر|pcs|عدد|tola|gram|carat|meter|yard|bottle|pkt|job|hour/i.test(lbl)) return 1;
  return null;
}

function renderVendorProducts(){
  const area = document.getElementById("vendorProductsArea");
  if(!activeCategory){ area.innerHTML = '<div class="loading">کیٹگری چنیں</div>'; return; }
  const itemsObj = currentCatalog[activeCategory] || {};
  const keys = Object.keys(itemsObj);
  if(!keys.length){
    area.innerHTML = '<div class="loading">اس کیٹگری میں آئٹم نہیں — Add Product</div>';
    return;
  }
  const presets = [
    {label:"⚖️ Weight", type:"weight"},{label:"🧴 Litre", type:"liquid"},{label:"📦 Pcs", type:"pcs"},
    {label:"🥚 Dozen", type:"dozen"},{label:"🥇 Gold", type:"gold"},{label:"💎 Carat", type:"gem"},
    {label:"📏 Meter", type:"meter"},{label:"🛠️ Service", type:"service"}
  ];
  area.innerHTML = "";
  keys.forEach(function(key){
    const it = itemsObj[key];
    if(!it.units) it.units = [{label: it.unit || "KG", rate: it.rate || 0}];
    if(!it.images) it.images = it.image ? [it.image] : [];
    const row = document.createElement("div");
    row.className = "product-row";
    const img0 = it.images[0] || "";
    const thumb = (img0 && img0.indexOf("data:") !== 0)
      ? '<img src="'+img0+'" style="width:100%;height:100%;object-fit:cover;" alt="">'
      : "🛒";
    row.innerHTML =
      '<div class="row-top">'+
        '<div class="thumb-box">'+thumb+'</div>'+
        '<div class="row-fields">'+
          '<input type="text" value="'+(it.name||"").replace(/"/g,"&quot;")+'" placeholder="نام" oninput="currentCatalog[activeCategory][\''+key+'\'].name=this.value; markCatDirty();">'+
          '<input type="text" class="img-url" value="'+(img0.indexOf("data:")===0?"":img0).replace(/"/g,"&quot;")+'" placeholder="Image URL (GitHub path)" onchange="setItemImage(\''+key+'\', this.value)">'+
        '</div>'+
      '</div>'+
      '<div class="units-box" id="ub-'+key+'">'+
        it.units.map(function(u, ui){
          return '<div class="unit-row">'+
            '<input class="u-label" type="text" value="'+(u.label||"").replace(/"/g,"&quot;")+'" oninput="currentCatalog[activeCategory][\''+key+'\'].units['+ui+'].label=this.value; markCatDirty();">'+
            '<input class="u-rate" type="text" inputmode="decimal" value="'+(u.rate||0)+'" oninput="handleVendorRate(\''+key+'\','+ui+',this)">'+
            (it.units.length>1?'<button type="button" class="btn-danger" style="padding:4px 8px;" onclick="removeVendorUnit(\''+key+'\','+ui+')">✕</button>':'')+
          '</div>';
        }).join("")+
      '</div>'+
      '<div class="preset-pills">'+
        presets.map(function(p){ return '<button type="button" class="preset-pill" onclick="applyVendorPreset(\''+key+'\',\''+p.type+'\')">'+p.label+'</button>'; }).join("")+
      '</div>'+
      '<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center;">'+
        '<button type="button" class="btn-secondary" style="font-size:11px;" onclick="addVendorUnit(\''+key+'\')">➕ Unit</button>'+
        '<label style="display:inline-flex;align-items:center;gap:4px;margin:0;"><input type="checkbox" '+(it.available!==false?"checked":"")+' onchange="currentCatalog[activeCategory][\''+key+'\'].available=this.checked; markCatDirty();"> Available</label>'+
        '<button type="button" class="btn-danger" onclick="deleteVendorProduct(\''+key+'\')">🗑</button>'+
      '</div>';
    area.appendChild(row);
  });
}

window.markCatDirty = function(){
  catalogDirty = true;
  document.getElementById("saveBar").style.display = "flex";
  document.getElementById("saveStatus").textContent = "⚠️ Unsaved — Save";
};

window.setItemImage = function(key, url){
  url = String(url||"").trim();
  const it = currentCatalog[activeCategory][key];
  it.images = url ? [url] : [];
  it.image = url;
  markCatDirty();
  renderVendorProducts();
};

window.handleVendorRate = function(key, ui, el){
  const val = parseFloat(String(el.value).replace(/,/g,"")) || 0;
  const it = currentCatalog[activeCategory][key];
  it.units[ui].rate = val;
  markCatDirty();
  const f0 = unitFactor(it.units[ui].label);
  if(f0 === 1 || ui === 0){
    const box = document.getElementById("ub-"+key);
    const inputs = box ? box.querySelectorAll(".u-rate") : [];
    it.units.forEach(function(u, i){
      if(i === ui) return;
      const f = unitFactor(u.label);
      if(f == null) return;
      u.rate = Math.round(val * f);
      if(inputs[i] && document.activeElement !== inputs[i]) inputs[i].value = u.rate;
    });
  }
};

window.applyVendorPreset = function(key, type){
  const it = currentCatalog[activeCategory][key];
  const base = (it.units && it.units[0]) ? (parseFloat(it.units[0].rate)||0) : 0;
  const presets = {
    weight: [{label:"KG",rate:base},{label:"آدھا کلو",rate:Math.round(base/2)},{label:"پاؤ",rate:Math.round(base/4)},{label:"دڑی (5 KG)",rate:Math.round(base*5)}],
    liquid: [{label:"Ltr",rate:base},{label:"½ Ltr",rate:Math.round(base/2)},{label:"250 ml",rate:Math.round(base/4)}],
    pcs: [{label:"Pcs",rate:base},{label:"Pkt",rate:base}],
    dozen: [{label:"عدد",rate:base},{label:"درجن",rate:Math.round(base*12)}],
    gold: [{label:"Tola",rate:base},{label:"Gram",rate:base}],
    gem: [{label:"Carat",rate:base},{label:"Gram",rate:base}],
    meter: [{label:"Meter",rate:base},{label:"Yard",rate:base}],
    service: [{label:"Job",rate:base},{label:"Hour",rate:base}]
  };
  it.units = presets[type] || [{label:"Unit",rate:base}];
  markCatDirty();
  renderVendorProducts();
  showToast("Preset applied");
};

window.addVendorUnit = function(key){
  currentCatalog[activeCategory][key].units.push({label:"", rate:0});
  markCatDirty();
  renderVendorProducts();
};
window.removeVendorUnit = function(key, ui){
  currentCatalog[activeCategory][key].units.splice(ui, 1);
  markCatDirty();
  renderVendorProducts();
};
window.addVendorProduct = function(){
  if(!activeCategory){ alert("پہلے کیٹگری بنائیں/چنیں"); return; }
  const id = "p" + Date.now();
  currentCatalog[activeCategory][id] = {
    name: "", name_roman: "", units: [{label:"KG", rate:0}], available: true, images: [], image: ""
  };
  markCatDirty();
  renderVendorProducts();
};
window.deleteVendorProduct = function(key){
  if(!confirm("Delete product?")) return;
  delete currentCatalog[activeCategory][key];
  markCatDirty();
  renderVendorProducts();
};

window.saveVendorCatalog = async function(){
  if(!currentVendorId) return;
  document.getElementById("saveStatus").textContent = "⏳ Saving…";
  try{
    const res = await fetch(RTDB + "/vendors/" + currentVendorId + "/items.json", {
      method: "PUT",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(denormalizeCatalogFlat(currentCatalog))
    });
    if(!res.ok) throw new Error("HTTP " + res.status);
    catalogDirty = false;
    document.getElementById("saveStatus").textContent = "✅ Saved";
    document.getElementById("saveBar").style.display = "flex";
    showToast("✅ Catalog saved");
  }catch(e){
    document.getElementById("saveStatus").textContent = "❌ Failed";
    showToast("Save failed: " + e.message, true);
  }
};

function watchVendorOrders(){
  const area = document.getElementById("vendorOrdersArea");
  area.innerHTML = '<div class="loading">⏳ Orders…</div>';
  // poll orders filtered by vendor_id
  async function pull(){
    try{
      const res = await fetch(RTDB + "/orders.json");
      const data = await res.json() || {};
      const list = Object.keys(data).map(function(code){
        const o = data[code] || {};
        o.code = o.code || code;
        return o;
      }).filter(function(o){
        return (o.vendor_id || "v001") === currentVendorId;
      });
      list.sort(function(a,b){
        const ta = Date.parse(a.timestamp) || 0;
        const tb = Date.parse(b.timestamp) || 0;
        return tb - ta;
      });
      if(!list.length){
        area.innerHTML = '<div class="loading">ابھی کوئی آرڈر نہیں</div>';
        return;
      }
      area.innerHTML = list.map(function(o){
        const st = String(o.status||"pending").toLowerCase();
        let cls = "pending";
        if(st==="completed"||st==="delivered") cls = "completed";
        if(st==="cancelled") cls = "cancelled";
        const open = activeOrderId === o.code ? " open" : "";
        return '<div class="chat-item '+cls+open+'" id="vo-'+o.code+'">'+
          '<div class="chat-header" onclick="toggleVOrder(\''+o.code+'\')">'+
            '<span>📌 '+o.code+' — '+(o.name||"")+'</span>'+
            '<span style="font-size:11px;">'+(st==="cancelled"?"❌":(cls==="completed"?"✅":"🕒"))+'</span>'+
          '</div>'+
          '<div class="chat-body" style="font-size:13px;line-height:1.8;">'+
            '<b>Phone:</b> <span dir="ltr">'+(o.phone||"")+'</span><br>'+
            '<b>Address:</b> '+(o.address||"")+'<br>'+
            '<div style="background:#F9F8F3;padding:8px;border-radius:8px;margin:6px 0;">'+(o.items||"")+'</div>'+
            '<b>Total:</b> Rs. '+(o.total||0)+
            (cls==="pending" ? '<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;">'+
              '<button type="button" class="btn-secondary" style="background:#C8E6C9;" onclick="vendorComplete(\''+o.code+'\')">✅ Delivered</button>'+
              '<button type="button" class="btn-danger" onclick="vendorCancel(\''+o.code+'\')">❌ Cancel</button></div>' : '')+
          '</div></div>';
      }).join("");
    }catch(e){
      area.innerHTML = '<div class="loading">Orders load failed</div>';
    }
  }
  pull();
  setInterval(pull, 12000);
}

window.toggleVOrder = function(code){
  activeOrderId = (activeOrderId === code) ? null : code;
  document.querySelectorAll(".chat-item").forEach(function(el){
    el.classList.toggle("open", el.id === "vo-"+activeOrderId);
  });
};

window.vendorComplete = async function(code){
  if(!confirm("Mark delivered?")) return;
  try{
    await fetch(RTDB+"/orders/"+code+"/status.json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify("completed")});
    showToast("✅ Done");
  }catch(e){ showToast("Failed", true); }
};
window.vendorCancel = async function(code){
  const reason = prompt("Cancel reason:");
  if(reason === null) return;
  try{
    await fetch(RTDB+"/orders/"+code+".json",{
      method:"PATCH",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ status:"cancelled", cancelled_by:"Vendor", cancel_reason: reason||"" })
    });
    showToast("Cancelled");
  }catch(e){ showToast("Failed", true); }
};

// Auto session
(function(){
  try{
    const id = localStorage.getItem("sj_vendor_id");
    const auth = localStorage.getItem("sj_vendor_auth");
    if(id && auth === "1"){
      fetch(RTDB+"/vendors/"+encodeURIComponent(id)+".json")
        .then(function(r){ return r.json(); })
        .then(function(v){
          if(v && !v.blocked){
            currentVendorId = id;
            currentVendor = v;
            initVendorDashboard(v);
          }
        }).catch(function(){});
    }
  }catch(e){}
})();
</script>
